<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBJ Outil Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c11;--card:#131720;--card2:#0e1118;--line:#232a37;--tx:#e8ebf1;--mu:#8b93a5;--gold:#d4ad52;--blue:#3b82f6;--red:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:rgba(10,12,17,.96);border-bottom:1px solid var(--line);padding:8px 14px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
h1{font:700 21px Rajdhani,sans-serif;letter-spacing:1px;margin:0;color:var(--gold)}
h1 small{color:var(--mu);font:500 11px Inter;letter-spacing:0;margin-left:6px}
#sync{font-size:11px;color:var(--mu);margin-left:auto}#sync.ok{color:var(--ok)}#sync.ro{color:#fbbf24}
.tabs{display:flex;gap:2px;width:100%}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:8px 4px;font:600 14px Inter;cursor:pointer}
.tabs button.on{color:var(--tx);border-color:var(--gold)}
main{max-width:1280px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h3{font:700 17px Rajdhani,sans-serif;letter-spacing:.5px;margin:0 0 6px;display:inline-block}
summary{cursor:pointer;list-style:none} summary::-webkit-details-marker{display:none}
details>summary h3:before{content:"▸ ";color:var(--mu)} details[open]>summary h3:before{content:"▾ "}
.muted{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px;font:inherit}
.row input{flex:1;min-width:120px}textarea{width:100%;resize:vertical}
label{display:flex;gap:6px;align-items:center;margin:4px 0;color:var(--mu)}
.btn{background:#1d2330;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 12px;font:600 13px Inter;cursor:pointer}
.btn.pri{background:var(--gold);color:#111;border-color:var(--gold)}.btn.big{padding:12px 18px;font-size:15px}.btn.sm{padding:5px 10px;font-size:12px}
.lnk{background:none;border:0;color:var(--gold);cursor:pointer;font-size:12px;text-decoration:underline}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mu);padding:7px 16px;font:700 13px Inter;cursor:pointer}
.seg button.on.B{background:var(--blue);color:#fff}.seg button.on.R{background:var(--red);color:#fff}
/* icônes */
.av{--d:30px;display:inline-block;width:var(--d);height:var(--d);border-radius:50%;flex:none;vertical-align:middle;background:#1d2330 url(champs.webp) no-repeat;background-size:calc(var(--d)*14) auto;background-position:calc(var(--c)*var(--d)*-1) calc(var(--r)*var(--d)*-1);border:1px solid #2c3445;color:var(--mu);font:700 10px Inter;text-align:center;line-height:var(--d)}
.av.xs{--d:20px}.av.sm{--d:24px}.av.md{--d:34px}.av.lg{--d:50px}.av.xl{--d:56px;border-radius:10px}
/* bandeau */
.strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sl1{display:flex;align-items:center;gap:10px}.gn{font:700 20px Rajdhani,sans-serif}
.sl2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.lu{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}.lu em{font-style:normal;color:var(--mu);font-weight:500;margin-right:4px}
.locked{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:8px;padding:6px 8px;background:var(--card);border-radius:10px;border:1px solid var(--line)}
.locked .muted{margin-right:6px}.lk{position:relative;filter:grayscale(1);opacity:.6}.lk:after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#f87171;font-weight:700;font-size:20px}
/* arène de draft */
.arena{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:10px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;border-top:4px solid var(--blue)}
.col.R{border-top-color:var(--red)}.col.us{box-shadow:0 0 0 1px var(--gold) inset}
.ct{font:700 15px Rajdhani,sans-serif;letter-spacing:1.5px;margin-bottom:8px;color:var(--mu)}.col.B .ct{color:#93c5fd}.col.R .ct{color:#fca5a5}
.bans{display:flex;gap:5px;align-items:center;margin-bottom:10px}.bans i{width:8px}
.ban{width:36px;height:36px;border-radius:50%;border:1px dashed #3a4356;display:grid;place-items:center;filter:grayscale(.9);opacity:.85;position:relative}
.ban .av{border:0}.ban:has(.av):after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:#f87171;transform:rotate(-40deg)}
.ban.cur,.pk.cur{outline:2px solid var(--gold);outline-offset:2px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{outline-color:rgba(212,173,82,.3)}}
.pk{display:flex;align-items:center;gap:8px;min-height:68px;padding:6px;border-radius:10px;background:var(--card2);margin-bottom:6px}
.pk.empty{justify-content:center;color:#4b5567;font-size:12px;border:1px dashed #262e3c;background:none}
.pki{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.pk .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk select{padding:2px 4px;font-size:11px;width:fit-content}
.flex{background:none;border:1px solid var(--line);color:var(--mu);border-radius:6px;width:26px;height:26px;cursor:pointer;font-weight:700;font-size:16px;line-height:1}
.flex.on,.fx{color:var(--gold);border-color:var(--gold)}
.center{min-width:0}
.banner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;font:700 20px Rajdhani,sans-serif;letter-spacing:1px;background:var(--card);border:1px solid var(--line)}
.banner span{font-size:13px;color:var(--mu);font-family:Inter}.banner.B{border-left:6px solid var(--blue)}.banner.R{border-left:6px solid var(--red)}
.banner.ours{background:linear-gradient(90deg,rgba(212,173,82,.18),var(--card));color:var(--gold)}.banner.done{color:var(--ok)}
.inrow input{font-size:16px;padding:10px}
.wait{margin:6px 0}
.recs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.rl{width:78px;flex:none;display:flex;flex-direction:column}.rl b{font:700 15px Rajdhani,sans-serif;color:var(--gold);letter-spacing:.5px}.rl span{font-size:11px;color:var(--mu)}
.bubs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:thin}
.bub{position:relative;background:none;border:0;padding:4px 2px 0;width:66px;flex:none;cursor:pointer;color:var(--tx);display:flex;flex-direction:column;align-items:center;border-radius:10px}
.bub:hover{background:#1b2130}.bub .av{border:2px solid #2c3445}.bub.prep .av{border-color:var(--gold);box-shadow:0 0 8px rgba(212,173,82,.5)}
.bub.dim{opacity:.55}
.bub .sc{position:absolute;top:0;right:4px;background:#2a3141;color:var(--tx);font:700 12px Inter;border-radius:10px;padding:0 5px;line-height:17px}
.bub .sc.hi{background:var(--gold);color:#111}.bub .sc.md{background:#6b5a2a}
.bn{font-size:10.5px;margin-top:2px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ids{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px}.ids>div{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.ids em{font-style:normal;color:var(--mu);margin-right:6px}.tag{background:#2a2410;color:var(--gold);border-radius:12px;padding:1px 8px;margin-right:4px;font-weight:600}
.detail{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:46px;font-size:13px}
.detail .sc{font:700 16px Rajdhani,sans-serif;color:var(--gold)}
.why{color:var(--mu);font-size:12px;margin-top:3px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}
.bars span{position:relative;height:16px;background:#1a202b;border-radius:4px;overflow:hidden}
.bars i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6b5520,var(--gold));opacity:.75}
.bars em{position:relative;font:600 10px Inter;font-style:normal;padding-left:4px;line-height:16px}
.endrow{justify-content:center;margin-top:12px}
/* préparation */
.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.lineup label{flex-direction:column;align-items:stretch;gap:2px;margin:0}.lineup em{font-style:normal;font-size:11px}
.warn{color:#fbbf24;font-size:12px}
.bplan{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.bpc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.bpc{position:relative;align-items:stretch;text-align:left}.bpc>.av,.bpc>b,.bpc>.muted{align-self:center;text-align:center}.bpc .rk{position:absolute;top:8px;left:10px;font:700 22px Rajdhani,sans-serif;color:var(--gold)}
.btags{display:flex;flex-wrap:wrap;justify-content:center;margin:2px 0}.tag.star{background:#3b2f0b;color:#fcd34d}.tag.warn{background:#3a2a10;color:#fbbf24}.tag.cnt{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}.tag.cnt .av{border-color:#a16207}
.bwhy{margin:4px 0 0;padding-left:16px;font-size:12px;color:#c7cdd8}.bwhy li{margin:2px 0}.bwhy .cw{color:#fbbf24}
.opp{border-top:1px solid var(--line);padding:6px 0}.opp select{padding:3px 6px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 9px 2px 3px;font-size:12px}
/* pools */
.ptabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:8px}.ptabs button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center}
.ptabs button em{font-style:normal;font-size:10px;color:var(--mu);font-weight:500}.ptabs button.on{border-color:var(--gold);color:var(--gold)}
.trow{display:flex;gap:8px;align-items:stretch;border-bottom:1px solid var(--line);padding:6px 0}
.tl{width:42px;flex:none;display:grid;place-items:center;font:700 26px Rajdhani,sans-serif;border-radius:8px}
.tS{color:#f87171}.tA{color:#fb923c}.tB{color:#facc15}.tC{color:#4ade80}.tD{color:#60a5fa}.tQ{color:var(--mu);font-size:15px}
.tcs{display:flex;flex-wrap:wrap;gap:4px}
.pc{background:none;border:0;color:var(--tx);width:74px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:8px;position:relative}
.pc:hover{background:#1b2130}.pn{font-size:10.5px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm{font-size:10px;color:var(--mu)}.pm i{font-style:normal}
.pa{position:absolute;top:2px;right:6px;background:#2a3141;font:700 11px Inter;border-radius:9px;padding:0 5px}
.pop{position:sticky;bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#1d2330;border:1px solid var(--gold);border-radius:12px;padding:8px 12px;margin-top:8px}
.pop button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
/* réglages */
.sl{display:block}.sl input{width:100%}
.plist div{display:flex;align-items:center;gap:5px;padding:3px 0;font-size:13px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two div div{display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;flex-wrap:wrap}
.rh{font:700 13px Rajdhani,sans-serif;letter-spacing:.8px;color:var(--gold);margin:6px 0 4px;text-transform:uppercase}
.up{color:var(--ok)}.dn{color:#f87171}.x{background:none;border:0;color:var(--mu);cursor:pointer;margin-left:auto}
.gtab{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:6px 12px;font:700 15px Rajdhani,sans-serif;cursor:pointer}.gtab.on{color:var(--tx);border-color:var(--gold)}
.banner.edit{border-left:6px solid var(--gold);color:var(--gold)}
.cbar{display:flex;align-items:center;gap:8px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-height:50px}.cbar .sp{flex:1}.cbar b{font-size:15px}
.cbar .btn.pri{padding:10px 22px;font-size:15px}.cbar .btn[disabled]{opacity:.4;cursor:default}
.bub.sel,.gc.sel{background:#2a2410;outline:2px solid var(--gold)}
.badge{position:absolute;top:32px;left:6px;font:700 10px Inter;font-style:normal;border-radius:6px;padding:0 4px;line-height:15px}.badge.B{background:#14532d;color:#bbf7d0}.badge.C{background:#7f1d1d;color:#fecaca}.gc{position:relative}.gc .badge{top:24px;left:4px;font-size:9px;line-height:13px}
.ids5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ids5 label{flex-direction:column;align-items:stretch;gap:2px;margin:0}.ids5 em{font-style:normal;font-size:11px}.ids5 input{min-width:0}
.rrow.later{opacity:.75}.hint{font-size:10px;color:#fbbf24}
.duob{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 8px 4px;display:flex;flex-wrap:wrap;align-items:center;gap:2px;width:118px;flex:none;cursor:pointer;color:var(--tx)}
.duob:hover{border-color:var(--gold)}.duob .bn{width:100%;text-align:center;max-width:none;font-size:10px}.duob .sc{position:absolute;top:-6px;right:-4px;background:#2a3141;font:700 12px Inter;border-radius:10px;padding:0 5px}.duob .sc.hi{background:var(--gold);color:#111}
.gridbox{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.gtools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.gtools input{flex:1;min-width:120px;padding:6px 8px}
.rf{background:var(--card2);border:1px solid var(--line);color:var(--mu);border-radius:7px;padding:5px 9px;font:600 12px Inter;cursor:pointer}.rf.on{color:var(--gold);border-color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:2px;max-height:230px;overflow-y:auto;scrollbar-width:thin}
.gc{background:none;border:0;color:var(--tx);display:flex;flex-direction:column;align-items:center;padding:3px 1px;border-radius:8px;cursor:pointer;font-size:9.5px}
.gc span{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gc:hover{background:#1b2130}.gc.off{opacity:.25;filter:grayscale(1);cursor:default}
.ban{background:none;cursor:pointer;padding:0}.ban.pv,.pk.pv{opacity:.75}
.pkb{background:none;border:0;padding:0;cursor:pointer;border-radius:10px}.pkb:hover .av{outline:2px solid var(--gold)}
.bars.b6,.bars.b7,.bars.b8{grid-template-columns:repeat(4,1fr)}
.bars.b4{grid-template-columns:repeat(4,1fr)}
.ana{margin-top:10px}.acards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.acard em{font-style:normal;color:var(--mu);font-size:12px;display:block;margin-bottom:4px}.acard div{margin:3px 0}
.tag{display:inline-block;border-radius:12px;padding:2px 9px;margin:2px 4px 2px 0;font-size:12px;font-weight:600}.tag.ok{background:#12301f;color:#86efac}.tag.ko{background:#3a1515;color:#fca5a5}
.lanes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.lane{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:4px}.lane.w{border-color:#166534;color:#86efac}.lane.l{border-color:#7f1d1d;color:#fca5a5}
.plan{margin:8px 0 0;padding-left:18px;font-size:13px}.plan li{margin:3px 0}

/* ===== v7 : écran de draft ===== */
body.drafting main{max-width:1500px;padding:6px 10px}
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.gtabs{display:flex;gap:4px}.dtop .sl2{margin-left:auto}
.arena{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:10px;align-items:start}
body.drafting .arena{height:calc(100vh - 128px);align-items:stretch}
.colw{display:flex;flex-direction:column;min-width:0}
.tname{font:700 20px Rajdhani,sans-serif;letter-spacing:1px;text-align:center;padding:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.B{color:#93c5fd}.tname.R{color:#fca5a5}
.col{flex:1;transition:box-shadow .2s}
.col.active.B{box-shadow:0 0 0 2px var(--blue),0 0 24px rgba(59,130,246,.45)}.col.active.R{box-shadow:0 0 0 2px var(--red),0 0 24px rgba(239,68,68,.45)}
.col .ct{display:none}
.pk.empty{min-height:62px}
.center{display:flex;flex-direction:column;min-height:0;gap:6px}
.turn{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 12px;border-radius:12px;font:700 26px Rajdhani,sans-serif;letter-spacing:2px;text-transform:uppercase;background:var(--card);border:2px solid var(--line)}
.turn.B{border-color:var(--blue);color:#bfdbfe;background:linear-gradient(90deg,rgba(59,130,246,.25),var(--card) 70%)}
.turn.R{border-color:var(--red);color:#fecaca;background:linear-gradient(270deg,rgba(239,68,68,.25),var(--card) 70%)}
.turn.ours{color:var(--gold);box-shadow:0 0 18px rgba(212,173,82,.35)}
.turn.edit{border-color:var(--gold);color:var(--gold)}
.turn .ta{font-size:30px;padding:0 12px;border-radius:8px;background:rgba(0,0,0,.35)}
.turn .tw{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locked{margin:0;padding:4px 8px}.locked>span:first-child{font-size:11px;color:var(--mu);margin-right:6px}
.sugg{display:flex;flex-direction:column;gap:4px}
.sugg .rrow{padding:3px 8px}
.bub{width:56px;padding:2px 1px 0}.bub .av.lg{--d:40px}.bub .sc{top:-2px;right:1px;font-size:11px;line-height:15px}.bub .badge{top:27px;left:5px}.bub .bn{font-size:10px}
.sugg .rrow{padding:2px 8px;gap:8px}.sugg .rl{width:70px}.sugg .rl b{font-size:14px}
.rrow.later .bub{width:34px}.rrow.later .bub .av.lg{--d:28px}.rrow.later .bub .bn,.rrow.later .bub .badge{display:none}.rrow.later .bub .sc{font-size:9px;line-height:12px}
.duob .av.md{--d:30px}.duob{width:auto;padding:4px 6px;gap:2px}
.bub .sc.rank{background:#2a3141}.bub .sc.rank.hi{background:var(--gold);color:#111}
.gridbox{flex:1;min-height:180px;display:flex;flex-direction:column;margin-top:0}
.cgrid{flex:1;max-height:none;min-height:0}
.cbar{margin:6px 0 0;border:0;background:var(--card2);padding:6px 8px}
.btn.confirm{padding:12px 34px;font-size:16px}
#tip{position:absolute;z-index:20;max-width:340px;background:#1b2130;border:1px solid var(--gold);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;display:none}
#tip.on{display:block}#tip .sc{color:var(--gold);font-weight:700}#tip .why{color:#c7cdd8}
.bars.b3{grid-template-columns:repeat(3,1fr)}
.final{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:2px}
.winbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.wl{font:700 18px Rajdhani,sans-serif;width:120px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wl.r{text-align:right;color:#fca5a5}

// ===== Moteur de draft v7 (logique pure, sans DOM) =====
const ROLES = ["T","J","M","A","S"];
const AXES = ["early","scaling","teamfight","engage","peel","poke"];
const AXIS_FR = {early:"Early",scaling:"Scaling",teamfight:"Teamfight",engage:"Engage",peel:"Réception",poke:"Poke"};
const normName = s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");

const CHAMPS = {};
CHAMP_RAW.trim().split("\n").forEach(l=>{
  const [n,r,d,a]=l.split(";"); const v=a.split(",").map(Number);
  const o={name:n,roles:r.split(","),dmg:d}; AXES.forEach((x,i)=>o[x]=v[i]); CHAMPS[n]=o;
});
const CHAMP_NAMES = Object.keys(CHAMPS).sort((a,b)=>a.localeCompare(b));
const NAME_BY_NORM = {}; CHAMP_NAMES.forEach(n=>NAME_BY_NORM[normName(n)]=n);
Object.assign(NAME_BY_NORM,{maitreyi:"Master Yi",monkeyking:"Wukong",renata:"Renata Glasc",nunuwillump:"Nunu",nunuetwillump:"Nunu",mundo:"Dr. Mundo",j4:"Jarvan IV",tf:"Twisted Fate",mf:"Miss Fortune",ksante:"K'Sante"});
function findChamp(s){ const k=normName(s); return NAME_BY_NORM[k]||CHAMP_NAMES.find(n=>normName(n).startsWith(k)&&k.length>=3)||null; }
// ---- Matchups lolalytics patch 16.22 : Maître+ et Émeraude+ (poids 0,35) croisés, les deux sens du matchup fusionnés, puis ramenés vers 50 % selon l'échantillon (n/(n+250)) ----
const LOLA_N=LOLA_NAMES.split("|").map(n=>findChamp(n)||n);
const NEXT_DELTA={}; PATCH_NEXT.buff.split(",").forEach(c=>NEXT_DELTA[c]=1); PATCH_NEXT.nerf.split(",").forEach(c=>NEXT_DELTA[c]=-1);
// Ajustement patch : buff = +0,07 de force méta et +0,6 % de WR (matchups compris), nerf = -0,09 et -0,8 %
const PATCH_V=c=>NEXT_DELTA[c]>0?0.07:NEXT_DELTA[c]<0?-0.09:0, PATCH_WR=c=>NEXT_DELTA[c]>0?0.6:NEXT_DELTA[c]<0?-0.8:0;
const BOTX={}; // ADC>support -> WR de l'ADC (matchups croisés en bot)
const CTR_ALL=(()=>{ const out=[], seen=new Set();
  for(const L in LOLA_RAW){ LOLA_RAW[L].split(";").forEach(t=>{ const [ia,ib,d,n]=t.split(".").map(Number); const a=LOLA_N[ia], b=LOLA_N[ib]; if(!a||!b) return;
    const dd=d+10*(PATCH_WR(a)-PATCH_WR(b));
    if(L==="AS"){ BOTX[a+">"+b]={wr:50+dd/10,n:n*100}; return; }
    const wr=Math.round((50+Math.abs(dd)/10)*10)/10; if(Math.abs(dd)<10) return; out.push(dd>0?[a,b,wr,n*100,L]:[b,a,wr,n*100,L]); seen.add([a,b].sort().join("+")+"|"+L); }); }
  // (anciennes données lolstats retirées : matchups recroisés lolalytics Maître+ et Émeraude+, petits échantillons ramenés vers 50 %)
  return out; })();
function botCross(adc,sup){ const x=BOTX[adc+">"+sup]; return x?x.wr:null; }

const ROLE_SLOT_AVG={}; ["T","J","M","A","S"].forEach(r=>ROLE_SLOT_AVG[r]=(PRO_ROLE_SLOT_ALL.B[r]+PRO_ROLE_SLOT_ALL.R[r])/2);
const PRO_DUOS={}; PRO_DUO_RAW.split(";").forEach(t=>{ const [rr,pair,n,w]=t.split(":"); const [a,b]=pair.split("+").map(x=>findChamp(x)); if(!a||!b) return;

function teamEval(cfg,picks,lineup,prepPl){

function analyzeFinal(cfg,draft,prep,lineup){

  if(T.aff!=null) add("Expérience des joueurs",(U.aff-T.aff)*14, `Vous ${Math.round(U.aff*100)} · eux ${Math.round(T.aff*100)} (sur 100 : vos games vs leur solo Q préparée)`);

  add("Méta / force des picks",(U.meta-T.meta)*20, `Vous ${Math.round(U.meta*100)} · eux ${Math.round(T.meta*100)}`);
  add("Synergies",Math.max(-6,Math.min(6,(U.syn-T.syn)*0.6)), `Vous ${U.syn>0?"+":""}${Math.round(U.syn*10)/10} % · eux ${T.syn>0?"+":""}${Math.round(T.syn*10)/10} %`);

  const win=Math.round(Math.max(35,Math.min(65,50+0.6*total)));

}

function scoutProfile(p,P){
  const L=p.list, tot=L.reduce((s,x)=>s+x.g,0)||1, w=x=>x.g/tot;
  const ax={}; AXES.forEach(a=>ax[a]=L.reduce((s,x)=>s+w(x)*((CHAMPS[x.c]||{})[a]||0),0));
  const top=AXES.slice().sort((a,b)=>ax[b]-ax[a]).filter(a=>ax[a]>=1.6).slice(0,3);
  const dm={}; L.forEach(x=>{ const k=(CHAMPS[x.c]||{}).dmg||"?"; dm[k]=(dm[k]||0)+w(x); }); const dmg=Object.keys(dm).sort((a,b)=>dm[b]-dm[a])[0];
  const s1=w(L[0]||{g:0}), s3=L.slice(0,3).reduce((s,x)=>s+w(x),0);
  const shape=s1>=0.45?`One-trick ${L[0].c} : ${Math.round(s1*100)} % de ses games`:s3>=0.7?`Pool resserré : ${L.slice(0,3).map(x=>x.c).join(", ")} font ${Math.round(s3*100)} % de ses games`:`Pool large : ${L.length} champions joués`;
  // champion qu'il joue souvent mais avec de mauvais résultats : il risque de le prendre, inutile de le bannir
  const trap=L.filter(x=>x.wr!=null&&x.g>=Math.max(20,tot*0.06)&&x.wr<=47).sort((a,b)=>a.wr-b.wr)[0];
  const early=ax.early-ax.scaling;
  // Flex : champions de son pool jouables à son rôle mais surtout joués ailleurs (ADC qui joue Syndra, top qui joue des mids…)
  // Flex = champion présent dans le pool affiché de deux de leurs joueurs (chacun à son rôle, ≥ 5 games)
  const shown=q=>q.list.slice(0,15).filter(y=>y.g>=5);
  const fx=shown(p).map(x=>({c:x.c, o:(P||[]).filter(q=>q!==p&&shown(q).some(y=>y.c===x.c))})).filter(x=>x.o.length).slice(0,4);
  const off={}; (p.all||[]).forEach(x=>{ const c=CHAMPS[x.c]; if(x.g>=10&&c&&!c.roles.includes(p.role)){ const r=c.roles[0]; (off[r]=off[r]||[]).push(x.c); } });
  const offR=Object.keys(off).sort((a,b)=>off[b].length-off[a].length)[0];
  const lines=[shape, top.length?`Style : ${top.map(a=>AXIS_FR[a]).join(", ")}${Math.abs(early)>=0.5?(early>0?" · cherche l'early":" · joue le scaling"):""}`:"", fx.length?`Flex : ${fx.map(x=>`${x.c} (aussi ${x.o.map(q=>`${q.name.split("#")[0]} en ${ROLE_NAMES[q.role].toLowerCase()}`).join(", ")})`).join(" · ")}`:"", trap?`À laisser : il joue souvent ${trap.c} (${trap.g} games) mais seulement ${trap.wr} % de victoires, pas besoin de le bannir`:""];
  const op=offPool(p); if(op.length) lines.push(`Hors de son op.gg, peut sortir : ${op.map(x=>`${x.c} (${x.why})`).join(" · ")}`);
  return lines.filter(Boolean);
}
// Champions absents de son op.gg mais crédibles à son rôle : très présents en pro ou très joués en solo Q, proches de son style
function offPool(p,k=3){
  const has=new Set(p.list.filter(x=>x.g>=5).map(x=>x.c)), L=p.list, tot=L.reduce((s,x)=>s+x.g,0)||1;
  const st={}; AXES.forEach(a=>st[a]=L.reduce((s,x)=>s+x.g/tot*((CHAMPS[x.c]||{})[a]||0),0));
  const nst=Math.sqrt(AXES.reduce((s,a)=>s+st[a]*st[a],0))||1; let un=new Set(); try{ un=unavailable(live.series,live.draft); }catch(e){}
  return CHAMP_NAMES.filter(c=>CHAMPS[c].roles.includes(p.role)&&!has.has(c)&&!un.has(c)).map(c=>{ const m=metaInfo(c,p.role); if(m.off) return null;
    const pr=PRO[c], pro=pr?clamp01((pr.p+pr.b)/400):0, sq=clamp01((m.pres||0)/25), pop=Math.max(pro,sq);
    const C=CHAMPS[c], nc=Math.sqrt(AXES.reduce((s,a)=>s+C[a]*C[a],0))||1, sim=AXES.reduce((s,a)=>s+C[a]*st[a],0)/(nc*nst);
    return {c, s:0.65*pop+0.35*sim, why:pro>=sq?`très présent en pro, ${pr.p+pr.b} drafts`:`très joué en solo Q, ${m.pres} %`};
  }).filter(x=>x&&x.s>=0.5).sort((a,b)=>b.s-a.s).slice(0,k);
}

function enemyRole(c,taken){ const C=CHAMPS[c]; if(!C) return null; let P=[]; try{ P=prepPlayers(prep); }catch(e){}
  const prior=[1,0.55,0.3,0.2]; let best=null;
  C.roles.forEach((r,i)=>{ if(taken.includes(r)) return; const p=P.find(x=>x.role===r), x=p&&(p.all||p.list).find(y=>y.c===c);
    const s=(prior[i]||0.15)+(x?Math.min(0.6,x.g/100):0); if(!best||s>best.s) best={r,s}; });
  return best&&best.r; }
function addChamp(name,role){

  const un=unavailable(live.series,live.draft); if(un.has(n)&&!(old&&old.name===n)){ flash(n+" n'est plus disponible"); return false; }
  const [t,s]=STEPS[i]; const a={name:n};
  if(t==="pick"){ const taken=teamPicks(live.draft,s).filter(p=>!p.flex&&p!==old).map(p=>p.role);
    a.role=role||(old&&old.role&&CHAMPS[n].roles.includes(old.role)?old.role:null)||CHAMPS[n].roles.find(r=>!taken.includes(r))||CHAMPS[n].roles[0]; a.flex=old?!!old.flex:false;
    if(s!==live.draft.side&&!role&&!old){ const r=enemyRole(n,teamPicks(live.draft,s).filter(p=>!p.flex).map(p=>p.role)); if(r) a.role=r; } }
  live.draft.actions[i]=a; ui.hover=null; ui.pending=null; ui.edit=null; ui.gridQ=""; persist("live"); render(); return true;
}
function parseManual(txt){
  return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const k=l.indexOf(":"); const name=k>0?l.slice(0,k).trim():""; const rest=k>0?l.slice(k+1):l;
    const champs=rest.split(",").map(s=>s.trim()).filter(Boolean).map(s=>{ const m=s.match(/^(.+?)\s+(\d+)(?:\s+(\d+(?:[.,]\d+)?))?\s*%?$/); const c=findChamp(m?m[1]:s); return c?[c,m?+m[2]:0,m&&m[3]?parseFloat(m[3].replace(",",".")):null]:null; }).filter(Boolean);
    return {name, champs}; }).filter(p=>p.champs.length);
}
document.addEventListener("click",e=>{
  const sc=e.target.closest("[data-act]"); if(sc&&sc.dataset.act==="none") return;
  if(sc&&sc.dataset.act==="scout"){ ui.scout=sc.dataset.r; render(); return; }
  if(sc&&sc.dataset.act==="scoutclose"){ ui.scout=null; render(); return; }
  const b=e.target.closest("[data-act]"); if(!b||["SELECT","INPUT","TEXTAREA"].includes(b.tagName)) return; const act=b.dataset.act;
  if(act==="side"){ live.draft.side=b.dataset.v; live.sideManual=curGameNo(); live.sideHow="manuel"; persist("live"); render(); }
  else if(act==="choose"){ const n=b.dataset.n, now=Date.now();
    // double-clic : le premier clic redessine la grille, donc on le détecte nous-mêmes (même champion cliqué deux fois en moins de 450 ms)
    if(ui._lastChoose&&ui._lastChoose.n===n&&now-ui._lastChoose.t<450){ ui._lastChoose=null; ui.duoNext=null; addChamp(n,b.dataset.r||null); return; }
    ui._lastChoose={n,t:now}; ui.pending={name:n,role:b.dataset.r||null}; ui.duoNext=null; render(); }
  else if(act==="rup"){ const o=roleOrderOf(cfg).slice(), k=o.indexOf(b.dataset.r); if(k>0){ [o[k-1],o[k]]=[o[k],o[k-1]]; cfg.roleOrder=o; persist("config"); render(); } }
  else if(act==="duo"){ ui.pending={name:b.dataset.a,role:b.dataset.ra}; ui.duoNext={name:b.dataset.b,role:b.dataset.rb}; render(); }
  else if(act==="confirm"){ if(ui.pending){ const dn=ui.duoNext&&ui.duoNext.name!==ui.pending.name?ui.duoNext:null; ui.duoNext=null;
      if(addChamp(ui.pending.name,ui.pending.role)&&dn){ const i=live.draft.actions.findIndex(a=>!a);
        if(i>=0&&STEPS[i][0]==="pick"&&STEPS[i][1]===live.draft.side&&!unavailable(live.series,live.draft).has(dn.name)){ ui.pending=dn; render(); } } } }
  else if(act==="editslot"){ const k=+b.dataset.k; if(!live.draft.actions[k]) return; ui.edit=k; ui.pending=null; render(); }
  else if(act==="canceledit"){ ui.edit=null; ui.pending=null; render(); }
  else if(act==="clearslot"){ live.draft.actions[ui.edit]=null; ui.edit=null; ui.pending=null; persist("live"); render(); }
  else if(act==="grole"){ ui.gridRole=b.dataset.v; render(); }
  else if(act==="viewgame"){ const k=+b.dataset.k; ui.viewGame=k<0?null:k; render(); }
  else if(act==="undo"){ let i=curStep(); i=i<0?19:i-1; if(i>=0) live.draft.actions[i]=null; ui.pending=null; persist("live"); render(); }
  else if(act==="flex"){ const a=live.draft.actions[+b.dataset.k]; a.flex=!a.flex; if(!a.flex) delete a.fx; persist("live"); render(); }
  else if(act==="nextgame"){ const names=live.draft.actions.filter((a,i)=>a&&a.name&&STEPS[i][0]==="pick").map(a=>a.name);
    live.series.locked.push(...names); live.series.games.push({side:live.draft.side,actions:live.draft.actions,result:live.draft.result||null});
    live.draft={side:live.draft.side,actions:Array(20).fill(null)}; ui.edit=null; ui.pending=null; ui.viewGame=null; persist("live"); flash(names.length+" champions verrouillés"); render(); }
  else if(act==="newseries"){ archiveSeries(); ui.viewGame=null; ui.edit=null; ui.pending=null; live={series:{locked:[],games:[]},draft:{side:live.draft.side,actions:Array(20).fill(null)}}; persist("live"); render(); }
  else if(act==="clearprep"){ clearPrep(); flash("Préparation remise à zéro"); render(); }
  else if(act==="result"){ const g=ui.viewGame!=null?live.series.games[ui.viewGame]:live.draft; g.result=g.result===b.dataset.v?null:b.dataset.v; persist("live"); render(); }
  else if(act==="hview"){ ui.hist={s:+b.dataset.s,g:+b.dataset.g}; render(); }
  else if(act==="hclose"){ ui.hist=null; render(); }
  else if(act==="htype"){ const s=history.series[+b.dataset.s]; const T=["Scrim","Compétition"]; s.type=T[(T.indexOf(s.type||"Scrim")+1)%T.length]; persist("history"); render(); }
  else if(act==="goprep"){ ui.tab="prep"; render(); }
  else if(act==="pplayer"){ ui.poolPlayer=b.dataset.p; ui.tierPop=null; render(); }
  else if(act==="tierpop"){ ui.tierPop=b.dataset.c; render(); }
  else if(act==="settier"){ const t=b.dataset.t, c=ui.tierPop, T=cfg.tiers[ui.poolPlayer]=cfg.tiers[ui.poolPlayer]||{};
    if(t==="-") delete T[c]; else if(t!=="x") T[c]=t; ui.tierPop=null; if(t!=="x") persist("config"); render(); }
  else if(act==="addpool"){ const n=findChamp($("#addpool").value); if(!n) return flash("Champion inconnu"); (cfg.tiers[ui.poolPlayer]=cfg.tiers[ui.poolPlayer]||{})[n]="B"; persist("config"); render(); }
  else if(act==="askprep"){ const ids=(prep.ids||[]).map(x=>(x||"").trim()).filter(Boolean); if(!ids.length) return flash("Entre au moins un pseudo");
    if(ids.some(x=>!x.includes("#"))) return flash("Ajoute le #TAG à chaque pseudo"); prep.request={ids:(prep.ids||[]).map(x=>(x||"").trim()), link:prep.link||multiLink(), at:new Date().toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}), status:"pending"}; persist("prep"); render(); flash("Analyse demandée"); }
  else if(act==="applymanual"){ const pl=parseManual($("#manual").value); prep.players=pl.map(p=>({name:p.name,champs:p.champs})); prep.updatedAt=new Date().toLocaleString("fr-FR"); ui.manual=false; persist("prep"); render(); }
  else if(act==="clearprep"){ prep={...prep,opponent:"",link:"",players:[],updatedAt:null}; persist("prep"); render(); }
  else if(act==="addsyn"){ const x=findChamp($("#syn-a").value), y=findChamp($("#syn-b").value); if(!x||!y) return flash("Champion inconnu"); cfg.synManual.push([x,y,+$("#syn-v").value||3]); persist("config"); render(); }
  else if(act==="addctr"){ const x=findChamp($("#ctr-a").value), y=findChamp($("#ctr-b").value); if(!x||!y) return flash("Champion inconnu"); cfg.ctrManual.push([x,y,+$("#ctr-v").value||55,0]); persist("config"); render(); }
  else if(act==="ctroff"){ const k=b.dataset.a+">"+b.dataset.b+"|"+(b.dataset.r||"*"); cfg.ctrManual=cfg.ctrManual.filter(x=>x[0]+">"+x[1]+"|*"!==k); if(CTR_DATA.some(x=>ctrKey(x)===k)) cfg.ctrOff.push(k); persist("config"); render(); }
  else if(act==="ctrrestore"){ cfg.ctrOff=[]; persist("config"); render(); }
  else if(act==="reset"){ cfg=defaultConfig(); persist("config"); flash("Réglages réinitialisés"); render(); }
});
document.addEventListener("change",e=>{
  const b=e.target; const act=b.dataset&&b.dataset.act; if(!act) return;
  if(act==="lineup"){ prep.lineup[b.dataset.r]=b.value; persist("prep"); render(); }

  else if(act==="w"){ cfg.weights[b.dataset.k]=+b.value; persist("config"); render(); }
  else if(act==="exd"){ cfg.excludeD=b.checked; persist("config"); render(); }

  else if(act==="popp"){ prep.opponent=b.value; persist("prep"); }

});

document.addEventListener("input",e=>{ if(e.target.id==="gq"){ ui.gridQ=e.target.value; const pos=e.target.selectionStart; const box=$(".cgrid"); render(); const g=$("#gq"); if(g){ g.focus(); g.setSelectionRange(pos,pos); } } });

// Hors de Claude (GitHub Pages) : pas de base d'équipe, on charge la copie team.json publiée avec le site
async function initSnapshot(){
  if(window.claude&&window.claude.use) return;
  try{ const r=await fetch("team.json",{cache:"no-store"}); if(!r.ok) return; const s=await r.json(); if(!s||!s.at) return;
    let seen=0; try{ seen=+localStorage.getItem(LS+"-snap")||0; }catch(e){}
    if(s.at<=seen) return;
    if(s.config) cfg=migrate(Object.assign(defaultConfig(),s.config)); if(s.prep) prep=Object.assign({opponent:"",link:"",players:[],lineup:{...DEF_LINEUP}},s.prep); if(s.history) history=Object.assign({series:[]},s.history);
    try{ localStorage.setItem(LS+"-snap",String(s.at)); }catch(e){}
    sync.note="Données de l'équipe du "+new Date(s.at).toLocaleDateString("fr-FR"); saveLocal(); render(); renderSync();
  }catch(e){}
}
