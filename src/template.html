<!DOCTYPE html>
<html lang="fr">
<head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23d4ad52'/%3E%3C/svg%3E">

<title>BBJ Outil Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;overflow-x:hidden}

#sync{font-size:11px;color:var(--mu);margin-left:auto}#sync.ok{color:var(--ok)}#sync.ro{color:#fbbf24}
.tabs{display:flex;gap:2px;width:100%}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:8px 4px;font:600 14px Inter;cursor:pointer}
.tabs button.on{color:var(--tx);border-color:var(--gold)}
main{max-width:1280px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}

summary{cursor:pointer;list-style:none} summary::-webkit-details-marker{display:none}

.muted{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px;font:inherit}
.row input{flex:1;min-width:120px}textarea{width:100%;resize:vertical}
label{display:flex;gap:6px;align-items:center;margin:4px 0;color:var(--mu)}
.btn{background:#1d2330;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 12px;font:600 13px Inter;cursor:pointer}
.btn.pri{background:var(--gold);color:#111;border-color:var(--gold)}.btn.big{padding:12px 18px;font-size:15px}.btn.sm{padding:5px 10px;font-size:12px}

.av.xs{--d:20px}.av.sm{--d:24px}.av.md{--d:34px}.av.lg{--d:50px}.av.xl{--d:56px;border-radius:10px}

.sl2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.lu{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}.lu em{font-style:normal;color:var(--mu);font-weight:500;margin-right:4px}
.locked{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:8px;padding:6px 8px;background:var(--card);border-radius:10px;border:1px solid var(--line)}
.locked .muted{margin-right:6px}.lk{position:relative;filter:grayscale(1);opacity:.6}.lk:after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#f87171;font-weight:700;font-size:20px}

.arena{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:10px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;border-top:4px solid var(--blue)}

.bans{display:flex;gap:5px;align-items:center;margin-bottom:10px}.bans i{width:8px}

.ban.cur,.pk.cur{outline:2px solid var(--gold);outline-offset:2px;animation:pulse 1.4s infinite}

.pki{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.pk .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.flex{background:none;border:1px solid var(--line);color:var(--mu);border-radius:6px;width:26px;height:26px;cursor:pointer;font-weight:700;font-size:16px;line-height:1}
.flex.on,.fx{color:var(--gold);border-color:var(--gold)}
.center{min-width:0}

.banner span{font-size:13px;color:var(--mu);font-family:Inter}.banner.B{border-left:6px solid var(--blue)}.banner.R{border-left:6px solid var(--red)}

.inrow input{font-size:16px;padding:10px}

.bubs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:thin}
.bub{position:relative;background:none;border:0;padding:4px 2px 0;width:66px;flex:none;cursor:pointer;color:var(--tx);display:flex;flex-direction:column;align-items:center;border-radius:10px}
.bub:hover{background:#1b2130}.bub .av{border:2px solid #2c3445}.bub.prep .av{border-color:var(--gold);box-shadow:0 0 8px rgba(212,173,82,.5)}
.bub.dim{opacity:.55}

.bn{font-size:10.5px;margin-top:2px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ids{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px}.ids>div{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.ids em{font-style:normal;color:var(--mu);margin-right:6px}.tag{background:#2a2410;color:var(--gold);border-radius:12px;padding:1px 8px;margin-right:4px;font-weight:600}

.why{color:var(--mu);font-size:12px;margin-top:3px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}

.bars em{position:relative;font:600 10px Inter;font-style:normal;padding-left:4px;line-height:16px}
.endrow{justify-content:center;margin-top:12px}
/* préparation */
.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.lineup label{flex-direction:column;align-items:stretch;gap:2px;margin:0}.lineup em{font-style:normal;font-size:11px}
.warn{color:#fbbf24;font-size:12px}
.bplan{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.bpc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.bpc{position:relative;align-items:stretch;text-align:left}.bpc>.av,.bpc>b,.bpc>.muted{align-self:center;text-align:center}.bpc .rk{position:absolute;top:8px;left:10px;font:700 22px Rajdhani,sans-serif;color:var(--gold)}
.btags{display:flex;flex-wrap:wrap;justify-content:center;margin:2px 0}.tag.star{background:#3b2f0b;color:#fcd34d}.tag.warn{background:#3a2a10;color:#fbbf24}.tag.cnt{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}.tag.cnt .av{border-color:#a16207}
.bwhy{margin:4px 0 0;padding-left:16px;font-size:12px;color:#c7cdd8}.bwhy li{margin:2px 0}.bwhy .cw{color:#fbbf24}
.opp{border-top:1px solid var(--line);padding:6px 0}.opp select{padding:3px 6px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 9px 2px 3px;font-size:12px}

.ptabs{flex-wrap:wrap;display:flex;gap:4px;overflow-x:auto;margin-bottom:8px}.ptabs button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center}
.ptabs button em{font-style:normal;font-size:10px;color:var(--mu);font-weight:500}.ptabs button.on{border-color:var(--gold);color:var(--gold)}
.trow{display:flex;gap:8px;align-items:stretch;border-bottom:1px solid var(--line);padding:6px 0}

.tS{color:#f87171}.tA{color:#fb923c}.tB{color:#facc15}.tC{color:#4ade80}.tD{color:#60a5fa}.tQ{color:var(--mu);font-size:15px}
.tcs{display:flex;flex-wrap:wrap;gap:4px}
.pc{background:none;border:0;color:var(--tx);width:74px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:8px;position:relative}
.pc:hover{background:#1b2130}.pn{font-size:10.5px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm{font-size:10px;color:var(--mu)}.pm i{font-style:normal}
.pa{position:absolute;top:2px;right:6px;background:#2a3141;font:700 11px Inter;border-radius:9px;padding:0 5px}
.pop{position:sticky;bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#1d2330;border:1px solid var(--gold);border-radius:12px;padding:8px 12px;margin-top:8px}
.pc{position:relative}.pm2{display:flex;gap:4px;justify-content:center;margin-top:2px}.pm2>span{display:flex;flex-direction:column;align-items:center;line-height:1;border-radius:5px;padding:1px 3px;min-width:22px}.pm2 b{font-size:11px}.pm2 em{font-style:normal;font-size:8px;opacity:.75}.pm2 .tm{background:rgba(214,175,85,.18);border:1px solid rgba(214,175,85,.55);color:#f0d48a}.pm2 .tm.none{opacity:.4}.pm2 .sq{background:transparent;border:1px solid var(--line);color:var(--mu)}.pfb{position:absolute;top:2px;right:2px;font-size:10px;font-weight:700;border-radius:8px;padding:0 4px;background:#111}.pfb.good{color:#4fd18b}.pfb.mid{color:#e6c14a}.pfb.bad{color:#ef6b6b}
.pop{flex-direction:column;align-items:stretch}.poprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pop button.on{border-color:var(--gold);color:var(--gold)}.sheet{display:flex;gap:10px;align-items:flex-start}.sst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;margin:6px 0}.sst span{display:flex;flex-direction:column}.sst em{font-style:normal;font-size:11px;color:var(--mu)}.sst i{font-style:normal;font-size:11px;opacity:.7}.sst .good{color:#4fd18b}.sst .mid{color:#e6c14a}.sst .bad{color:#ef6b6b}
.pop button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
/* réglages */
.sl{display:block}.sl input{width:100%}
.plist div{display:flex;align-items:center;gap:5px;padding:3px 0;font-size:13px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two div div{display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;flex-wrap:wrap}
.rh{font:700 13px Rajdhani,sans-serif;letter-spacing:.8px;color:var(--gold);margin:6px 0 4px;text-transform:uppercase}
.up{color:var(--ok)}.dn{color:#f87171}.x{background:none;border:0;color:var(--mu);cursor:pointer;margin-left:auto}
.gtab{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:6px 12px;font:700 15px Rajdhani,sans-serif;cursor:pointer}.gtab.on{color:var(--tx);border-color:var(--gold)}
.banner.edit{border-left:6px solid var(--gold);color:var(--gold)}
.cbar{display:flex;align-items:center;gap:8px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-height:50px}.cbar .sp{flex:1}.cbar b{font-size:15px}
.cbar .btn.pri{padding:10px 22px;font-size:15px}.cbar .btn[disabled]{opacity:.4;cursor:default}
.bub.sel,.gc.sel{background:#2a2410;outline:2px solid var(--gold)}
.badge{position:absolute;top:32px;left:6px;font:700 10px Inter;font-style:normal;border-radius:6px;padding:0 4px;line-height:15px}.badge.B{background:#14532d;color:#bbf7d0}.badge.C{background:#7f1d1d;color:#fecaca}.gc{position:relative}.gc .badge{top:24px;left:4px;font-size:9px;line-height:13px}
.ids5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ids5 label{flex-direction:column;align-items:stretch;gap:2px;margin:0}.ids5 em{font-style:normal;font-size:11px}.ids5 label{min-width:0}.ids5 input{min-width:0;width:100%;box-sizing:border-box}
.rrow.later{opacity:.75}.hint{font-size:10px;color:#fbbf24}
.duob{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 8px 4px;display:flex;flex-wrap:wrap;align-items:center;gap:2px;width:118px;flex:none;cursor:pointer;color:var(--tx)}
.duob:hover{border-color:var(--gold)}.duob .bn{width:100%;text-align:center;max-width:none;font-size:10px}.duob .sc{position:absolute;top:-6px;right:-4px;background:#2a3141;font:700 12px Inter;border-radius:10px;padding:0 5px}.duob .sc.hi{background:var(--gold);color:#111}
.gridbox{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:2px;max-height:230px;overflow-y:auto;scrollbar-width:thin}

.ban{background:none;cursor:pointer;padding:0}.ban.pv,.pk.pv{opacity:.75}
.pkb{background:none;border:0;padding:0;cursor:pointer;border-radius:10px}.pkb:hover .av{outline:2px solid var(--gold)}

.bars.b4{grid-template-columns:repeat(4,1fr)}

/* ===== v7 : écran de draft ===== */
body.drafting main{max-width:1500px;padding:6px 10px}
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.gtabs{display:flex;gap:4px}.dtop .sl2{margin-left:auto}
.arena{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:10px;align-items:start}

.colw{display:flex;flex-direction:column;min-width:0}
.tname{font:700 20px Rajdhani,sans-serif;letter-spacing:1px;text-align:center;padding:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.col{flex:1;transition:box-shadow .2s}

.col .ct{display:none}
.pk.empty{min-height:62px}
.center{display:flex;flex-direction:column;min-height:0;gap:6px}

.turn.edit{border-color:var(--gold);color:var(--gold)}
.turn .ta{font-size:30px;padding:0 12px;border-radius:8px;background:rgba(0,0,0,.35)}
.turn .tw{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locked{margin:0;padding:4px 8px}.locked>span:first-child{font-size:11px;color:var(--mu);margin-right:6px}
.sugg{display:flex;flex-direction:column;gap:4px}
.sugg .rrow{padding:3px 8px}
.bub{width:56px;padding:2px 1px 0}.bub .av.lg{--d:40px}.bub .sc{top:-2px;right:1px;font-size:11px;line-height:15px}.bub .badge{top:27px;left:5px}.bub .bn{font-size:10px}
