function blindInfo(cfg,c,role){
  const k=c+"|"+role; if(_blindCache[k]) return _blindCache[k];

  const mi=metaInfo(c,role), bw=mi.wr||50;

  const hard=L.map(x=>({n:x[0],wr:x[2],d:rel(x[0])*Math.max(0,x[2]-(100-bw)-1.5)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);

}
function blindability(cfg,c,role){ return blindInfo(cfg,c,role).v; }
function pickBadge(c,role){ return blindInfo(null,c,role||(CHAMPS[c]?CHAMPS[c].roles[0]:"M")).badge; }
// matchup : si le laner adverse est connu => matchup de lane ; sinon => capacité à être pické à l'aveugle
function matchup(cfg,c,role,enemies){
  const I=ctrIndex(cfg); let s=0; const good=[],bad=[];
  const laner=enemies.find(e=>e.roles.length===1&&e.roles[0]===role);
  enemies.forEach(e=>{
    if(!e.roles.includes(role)) return;
    const same = e.roles.length>1?0.6:1;
    const g=ctrGet(I,c,e.name,role), b=ctrGet(I,e.name,c,role);
    if(g){ s+=same*(g[2]-50)/12; if(same>=0.6||g[2]>=55) good.push(e.name+" "+g[2]+"%"); }
    if(b){ s-=same*(b[2]-50)/12; if(same>=0.6||b[2]>=55) bad.push(e.name+" "+(100-b[2]).toFixed(1)+"%"); }

function compProfile(names){
  const p={}; AXES.forEach(a=>p[a]=0); let ad=0,ap=0;
  names.forEach(n=>{const c=CHAMPS[n]; if(!c) return; AXES.forEach(a=>p[a]+=c[a]);
    if(c.dmg==="AD") ad+=1; else if(c.dmg==="AP") ap+=1; else if(c.dmg==="MIX"){ad+=.5;ap+=.5;} });
  return {p,ad,ap};
}
const AXIS_AVG={}; AXES.forEach(a=>{ AXIS_AVG[a]=CHAMP_NAMES.reduce((s,n)=>s+CHAMPS[n][a],0)/CHAMP_NAMES.length; });
// Identité = axes nettement au-dessus de la moyenne dans les picks déjà faits
function identity(names){
  if(!names.length) return {axes:[],w:null};
  const p=compProfile(names).p, rel={};
  AXES.forEach(a=>rel[a]=p[a]/(AXIS_AVG[a]*names.length));
  const axes=AXES.slice().sort((a,b)=>rel[b]-rel[a]).filter(a=>rel[a]>=1.15).slice(0,2);
  const tot=AXES.reduce((s,a)=>s+Math.max(0,rel[a]-0.8),0)||1, w={};
  AXES.forEach(a=>w[a]=Math.max(0,rel[a]-0.8)/tot);

}
function cohesion(c,allies){
  const ch=CHAMPS[c]; if(!allies.length) return {v:0.5,fills:[],dmgNote:null};
  const id=identity(allies); let align=0; AXES.forEach(a=>align+=id.w[a]*ch[a]/3);

  const cur=compProfile(allies); let need=0.5;

// Habitudes de l'équipe : jungle/mid/ADC en premier, top en pick 4-5, support après l'ADC
function roleOrderOf(cfg){ const o=(cfg&&cfg.roleOrder&&cfg.roleOrder.length===5)?cfg.roleOrder:["J","A","S","M","T"]; return o; }
// Priorité d'un rôle à ce moment : rôles habituellement pickés tôt d'abord ; le support remonte une fois l'ADC pris
function rolePriority(pickNo,alliesRoles,cfg,enemyRoles){
  const o=roleOrderOf(cfg), out={};
  ROLES.forEach(r=>{ let slot=o.indexOf(r)+1; if(r==="S"&&alliesRoles.includes("A")) slot=Math.min(slot,pickNo); out[r]=1-0.15*Math.max(0,slot-1);
    if((enemyRoles||[]).includes(r)) out[r]+=1; }); // rôle déjà pické en face : on connaît leur champion, on répond en priorité
  return out;

// Timing : un rôle (et un champion) rarement pickés à ce moment de la draft sont pénalisés au début, puis plus du tout
function timingScore(cfg,c,role,ctx){
  if(ctx.enemies&&ctx.enemies.some(x=>x.roles.length===1&&x.roles[0]===role)) return 1; // répondre à un rôle déjà pické en face : le bon moment
  if(role==="S"&&ctx.alliesRoles.includes("A")) return 1; // le support suit l'ADC
  const side=ctx.side||"B", n=ctx.pickNo; let v;
  if(side==="B"&&n===1){ const f=PRO_FIRST.B; v=f[role]/Math.max(...Object.values(f)); }          // qui part en B1 aux Worlds
  else if(side==="R"&&n<=2){ const f=PRO_FIRST.R; v=f[role]/Math.max(...Object.values(f)); }     // qui part en R1-R2
  else v=clamp01(1-(PRO_ROLE_SLOT[side][role]-n-0.5)/2);                                          // position moyenne du rôle aux Worlds
  // le champion lui-même : un mid pické très tôt en pro (Orianna, Cassiopeia…) n'est pas pénalisé parce que les mids partent tard en moyenne
  const ps=PRO_SLOT[c+"|"+role]; if(ps&&ps.n>=15){ const vc=clamp01(1-(ps.s-n-1)/2), w=Math.min(1,ps.n/60); v=w*vc+(1-w)*v; }

function pickContext(draft,lineup,series){
  const us=draft.side, them=us==="B"?"R":"B";

  const i=draft.actions.findIndex(a=>!a);
  let enemyAfter=0; if(i>=0) for(let k=i;k<20;k++) if(STEPS[k][0]==="pick"&&STEPS[k][1]===them&&!draft.actions[k]) enemyAfter++;
  const theirOpen=openRoles(enemiesRaw.map(p=>({...p,role:p.role||(CHAMPS[p.name]?CHAMPS[p.name].roles[0]:null)})));
  const pickNo=allies.length+1;
  return {allies:allies.map(a=>a.name), alliesObj:allies.map(a=>({name:a.name,role:a.flex?null:a.role})), alliesRoles:allies.filter(a=>!a.flex).map(a=>a.role), enemies, lineup, pickNo, open:openRoles(allies),
    side:us, enemyAfter, theirOpen, firstPick:us==="B"&&pickNo===1, lastPick:us==="R"&&pickNo===5, redDuo:us==="R"&&pickNo<=2,

// Moment de la draft : ce que le côté et l'ordre des picks changent
function draftMoment(draft){
  const ctx=pickContext(draft,{}); const s=ctx.side, n=ctx.pickNo;
  if(ctx.firstPick) return "First pick : sécuriser un pick très fort et blindable, base de la compo";
  if(ctx.redDuo) return "Picks 1-2 enchaînés : prendre un duo avéré sans interruption";
  if(ctx.lastPick) return "Dernier pick : counter-pick d'une lane adverse";
  if(s==="B"&&n>=4) return "Le dernier pick adverse peut counter : rester blindable sur la lane encore ouverte";

function recommendPicks(cfg,series,draft,lineup,per=5){
  const un=unavailable(series,draft); const ctx=pickContext(draft,lineup,series); ctx.cfg=cfg; const out={};
  const prio=rolePriority(ctx.pickNo,ctx.alliesRoles,cfg,(ctx.enemies||[]).filter(x=>x.roles.length===1).map(x=>x.roles[0]));
  ctx.open.slice().sort((a,b)=>prio[b]-prio[a]||roleOrderOf(cfg).indexOf(a)-roleOrderOf(cfg).indexOf(b)).forEach(role=>{
    const pid=lineup[role];
    const list=poolOf(cfg,pid,role).filter(c=>!un.has(c)).filter(c=>!(cfg.excludeD&&tierFor(cfg,pid,role,c)==="D"))
      .map(c=>scorePick(cfg,c,role,ctx)).sort((a,b)=>b.score-a.score).slice(0,per);
    // Picks 4-5 : ce qui comblerait les faiblesses de NOTRE compo (anneau bleu), y compris 2 champions hors de son pool mais très bons dans la draft actuelle
    const gaps=ctx.allies.length>=3?familyGaps(ctx.allies.map(a=>a.name||a)).filter(g=>g!=="catch"):[];
    if(gaps.length){ list.forEach(x=>{ const f=familiesOf(x.name).find(k=>gaps.includes(k)); if(f) x.fill=f; });

        .map(c=>{ const x=scorePick(cfg,c,role,ctx); x.fill=familiesOf(c).find(k=>gaps.includes(k)); x.offpool=true; x.why.unshift(`Hors de son pool, mais comble notre manque de ${FAMS[x.fill].fr.toLowerCase()}`); return x; })
        .sort((a,b)=>b.score-a.score).slice(0,2);
      const ref=list[4]?list[4].score:0; extra.forEach((x,k)=>{ let i=list.findIndex(y=>!y.offpool&&y.score<x.score); if(i<0) i=list.length; list.splice(x.score>=ref-8?Math.max(Math.min(i,5+k),Math.min(5+k,list.length)):Math.min(i,7+k),0,x); }); list.forEach(x=>{ if(x.fill&&!x.offpool) x.why.unshift(`Comble notre manque de ${FAMS[x.fill].fr.toLowerCase()}`); }); }

const DASHERS=new Set("Leona,Vi,Akali,Corki,Rakan,Alistar,Rell,Jarvan IV,Lee Sin,Yone,Yasuo,Irelia,Kai'Sa,Camille,Hecarim,Sejuani,Wukong,Xin Zhao,Pantheon,Gragas,Lucian,Tristana,Kalista,Ambessa,Gwen,Riven,Fiora,Jax,Renekton,Zac,Diana,Kha'Zix,Rengar,Qiyana,Sylas,LeBlanc,Ahri,Galio,Maokai,Vayne,Graves,Kindred,Lillia,Viego,Aatrox".split(","));
const IMMOBILE=new Set("Jinx,Ashe,Varus,Jhin,Miss Fortune,Senna,Smolder,Twitch,Sivir,Aphelios,Kog'Maw,Ziggs,Lulu,Soraka,Sona,Yuumi,Nami,Karma,Milio,Seraphine,Zilean,Janna,Zyra,Xerath,Lux,Morgana,Brand,Vel'Koz,Swain".split(","));
function traitDanger(c,ours){ // ours = [{name,role}]
  let v=0; const why=[]; const bot=ours.filter(o=>o.role==="A"||o.role==="S").map(o=>o.name);
  if(HOOKS.has(c)){ const im=bot.filter(n=>IMMOBILE.has(n)); if(im.length){ v+=0.35*im.length; why.push(`Grappin : punit votre ${im.join(" + ")}, peu mobile${im.length>1?"s":""}`); } }
  if(ANTIDASH.has(c)){ const ds=ours.map(o=>o.name).filter(n=>DASHERS.has(n)); if(ds.length>=2){ v+=0.2*ds.length; why.push(`Bloque les dashs de ${ds.join(", ")}`); } }
  return {v:Math.min(1,v), why};
}
// ---- Support exposé : leur support n'est pas choisi et ils piquent encore après vous ----
function botExposure(cfg,series,draft,prep,lineup){
  const i=draft.actions.findIndex(a=>!a); if(i<0) return null;
  const us=draft.side, them=us==="B"?"R":"B";
  const ours=teamPicks(draft,us).map(a=>({name:a.name,role:a.flex?null:a.role})), theirs=teamPicks(draft,them);
  if(theirs.some(p=>p.role==="S")) return null;
  let after=0; for(let k=i;k<20;k++) if(STEPS[k][0]==="pick"&&STEPS[k][1]===them&&!draft.actions[k]) after++;
  if(!after) return null;
  const ourS=ours.find(o=>o.role==="S"), ourTurn=STEPS[i][1]===us;
  if(!ourS&&!(ourTurn&&STEPS[i][0]==="pick")) return null;
  let R=null; try{ R=enemyCandidates(cfg,series,draft,prep,lineup).find(x=>x.role==="S"); }catch(e){}
  const threats=(R?R.list.slice(0,10):[]).map(x=>{ const t=traitDanger(x.name,ours); return {name:x.name, s:x.s*(0.5+t.v)+0.2*t.v, why:[...t.why, ...x.why.slice(0,1)]}; })
    .sort((a,b)=>b.s-a.s).slice(0,3);
  const phase2=draft.actions.filter((a,k)=>a&&STEPS[k][0]==="pick").length>=6;
  if(ourS) return {kind:"post", after, threats, msg:`Votre bot est exposé : leur support n'est pas encore choisi (il leur reste ${after} pick${after>1?"s":""}).`+(phase2&&STEPS[i][0]==="ban"&&ourTurn?" Bannissez en priorité ce qui le contre.":"")};
  return {kind:"pre", after, threats, msg:`Support exposé au contre : si vous prenez votre support maintenant, ils choisiront le leur après vous.`+(us==="B"?" Côté bleu, prenez un support difficile à contrer et gardez vos 2 bans de phase 2 pour ses contres.":" Gardez-le pour votre dernier pick si possible.")};
}
// ---- Analyse des compos : forces, faiblesses, lanes, plan de jeu ----
function compTags(names){
  if(!names.length) return {strong:[],weak:[]};
  const p=compProfile(names).p, n=names.length, rel={}; AXES.forEach(a=>rel[a]=p[a]/(AXIS_AVG[a]*n));
  const strong=[], weak=[];
  if(rel.engage>=1.25&&rel.teamfight>=1.1) strong.push("Engage / teamfight"); else if(rel.engage>=1.25) strong.push("Engage");
  if(rel.poke>=1.4) strong.push(rel.peel>=1.1?"Poke / siège":"Poke");
  if(rel.engage>=1.15&&rel.early>=1.15) strong.push("Pick / dive");
  if(rel.teamfight>=1.25&&!strong.some(x=>x.includes("teamfight"))) strong.push("Teamfight");
  if(rel.early>=1.25) strong.push("Early game"); if(rel.scaling>=1.25) strong.push("Scaling");
  if(rel.peel>=1.3) strong.push("Réception / protection");
  if(n>=3){ if(rel.peel<0.7) weak.push("Peu de réception"); if(rel.engage<0.7) weak.push("Peu d'engage"); if(rel.early<0.8) weak.push("Early faible"); if(rel.scaling<0.8) weak.push("Scaling limité"); if(rel.teamfight<0.8) weak.push("Teamfight faible");
    const c=compProfile(names); const t=c.ad+c.ap; if(t>=4&&c.ad/t>0.8) weak.push("Dégâts presque tous physiques"); if(t>=4&&c.ap/t>0.8) weak.push("Dégâts presque tous magiques"); }
  return {strong,weak};
}
function analyzeDraft(cfg,draft){
  const us=draft.side, them=us==="B"?"R":"B"; const I=ctrIndex(cfg);
  const ours=teamPicks(draft,us), theirs=teamPicks(draft,them);
  const lanes=[];
  // Les 4 lanes sont toujours affichées (top, jungle, mid, botlane), même proches de 50 % ; sans duel mesuré, estimation par l'écart de winrate des deux champions (marquée ≈)
  const pick=(L,r)=>(L.find(p=>p.role===r&&!p.flex)||L.find(p=>p.role===r)||{}).name;
  const est=(a,b,r)=>{ const x=metaInfo(a,r).wr, y=metaInfo(b,r).wr; return x&&y?Math.round((50+(x-y)/2)*10)/10:50; };
  ["T","J","M"].forEach(r=>{ const a=pick(ours,r), b=pick(theirs,r); if(!a||!b) return;
    const g=ctrGet(I,a,b,r), l=ctrGet(I,b,a,r); const wr=g?g[2]:l?100-l[2]:null;
    lanes.push({role:r,ours:a,theirs:b,wr:wr!=null?Math.round(wr*10)/10:est(a,b,r),est:wr==null}); });
  { const A={o:pick(ours,"A"),t:pick(theirs,"A")}, S={o:pick(ours,"S"),t:pick(theirs,"S")};
    if(A.o&&S.o&&A.t&&S.t){ const b=botEdge(cfg,A.o,S.o,A.t,S.t);
      lanes.push(b.why.length?{role:"B",ours:A.o,ours2:S.o,theirs:A.t,theirs2:S.t,wr:Math.round((50+b.v/2)*10)/10,detail:b.why.join(" · ")}
        :{role:"B",ours:A.o,ours2:S.o,theirs:A.t,theirs2:S.t,wr:Math.round(((est(A.o,A.t,"A")+est(S.o,S.t,"S"))/2)*10)/10,est:true}); } }
  const plan=gamePlan(ours.map(p=>p.name),theirs.map(p=>p.name),lanes);
  return {us:compTags(ours.map(p=>p.name)), them:compTags(theirs.map(p=>p.name)), lanes, plan};
}
// Plan de jeu par phase, à partir du profil des deux compos et des lanes
function gamePlan(us,them,lanes){
  // Seulement des conseils marqués : une vraie dominance de lane ou un net écart de profil entre les compos. Rien de générique.
  const early=[], mid=[], late=[];
  if(us.length<4||them.length<4) return {early,mid,late,key:[]};
  const pu=compProfile(us).p, pt=compProfile(them).p, d=a=>pu[a]-pt[a], T=3;
  const real=lanes.filter(l=>!l.est), win=real.filter(l=>l.wr>=55).sort((a,b)=>b.wr-a.wr), lose=real.filter(l=>l.wr<=45).sort((a,b)=>a.wr-b.wr);
  const has=r=>win.find(l=>l.role===r), hurt=r=>lose.find(l=>l.role===r), nm=l=>l.ours+(l.ours2?" + "+l.ours2:"");
  const earlyUs=d("early")>=T, earlyThem=d("early")<=-T, scaleUs=d("scaling")>=T, scaleThem=d("scaling")<=-T;
  if(has("T")) early.push(`Top gagnant (${nm(has("T"))}, ${has("T").wr} %) : prio top pour les larves du néant.`);
  if(has("B")) early.push(`Botlane gagnante (${nm(has("B"))}, ${has("B").wr} %) : premier dragon et plaques bot.`);
  if(hurt("T")) early.push(`Top en difficulté (${nm(hurt("T"))}, ${hurt("T").wr} %) : pas de larves sans prio top.`);
  if(hurt("B")) early.push(`Botlane difficile (${nm(hurt("B"))}, ${hurt("B").wr} %) : céder le premier dragon, prendre les larves en échange.`);
  if(hurt("M")) early.push(`Mid difficile (${nm(hurt("M"))}, ${hurt("M").wr} %) : le jungler couvre le mid.`);
  if(earlyUs) early.push("Compo nettement plus forte en early : envahir et forcer les objectifs avant 14 min.");
  if(earlyThem) early.push("Ils sont nettement plus forts en early : warder sa jungle, échanger côté opposé.");
  if(d("teamfight")>=T) mid.push("Teamfight nettement supérieur : forcer les fights à 5 sur chaque dragon.");
  else if(d("teamfight")<=-T) mid.push("Leur teamfight est nettement meilleur : éviter les fights à 5, jouer les side lanes et les picks.");
  if(d("poke")>=T) mid.push("Gros avantage de poke : user avant chaque objectif, siège des tours.");
  else if(d("poke")<=-T) mid.push("Ils ont beaucoup plus de poke : engager vite ou contourner, ne pas rester en siège.");
  if(d("peel")<=-T) mid.push("Très peu de réception : vos carries restent derrière, attention aux plongeurs.");
  if(scaleUs) late.push("Vous scalez nettement mieux : pas de coin-flip, viser l'âme et le Baron.");
  if(scaleThem) late.push("Ils scalent nettement mieux : finir avant 30 min, Baron dès qu'un fight est gagné.");
  const key=[]; if(earlyUs) key.push("Jouer l'avance early"); if(earlyThem) key.push("Survivre à leur early");
  if(scaleUs) key.push("Scaling"); if(scaleThem) key.push("Finir vite"); if(d("teamfight")>=T) key.push("Stacker les drakes"); if(d("poke")>=T) key.push("Siège");
  return {early,mid,late,key};
}
// ---- Analyse de fin de draft : forces, faiblesses et estimation des chances de victoire ----
function teamEval(cfg,picks,lineup,prepPl){
  const roles=picks.map(p=>({name:p.name, role:p.flex?(CHAMPS[p.name]||{roles:["M"]}).roles[0]:p.role}));
  const meta=roles.reduce((s,p)=>s+force(cfg,p.name,p.role),0)/Math.max(1,roles.length);
  let syn=0; const synList=[];
  for(let a=0;a<roles.length;a++) for(let b=a+1;b<roles.length;b++){ const x=synVal(cfg,roles[a].name,roles[a].role,roles[b].name,roles[b].role); if(x){ syn+=x.v; if(Math.abs(x.v)>=2) synList.push(`${roles[a].name} + ${roles[b].name} (${x.v>0?"+":""}${x.v} %)`); } }
  // expérience des joueurs sur leurs champions
  let aff=0;
  roles.forEach(p=>{ if(lineup) aff+=affinity(cfg,lineup[p.role],p.role,p.name).v;
    else { const pl=(prepPl||[]).find(q=>q.role===p.role); const x=pl&&pl.list.find(z=>z.c===p.name); aff+= x? clamp01(1-Math.exp(-x.g/70)) : 0.35; } });
  aff/=Math.max(1,roles.length);
  if(!lineup&&!(prepPl||[]).length) aff=null;
  return {meta, syn, synList, aff, tags:compTags(roles.map(p=>p.name)), prof:compProfile(roles.map(p=>p.name))};
}
function analyzeFinal(cfg,draft,prep,lineup){
  const us=draft.side, them=us==="B"?"R":"B";
  const ours=teamPicks(draft,us), theirs=teamPicks(draft,them);
  const A=analyzeDraft(cfg,draft); const P=prepPlayers(prep);
  const U=teamEval(cfg,ours,lineup,null), T=teamEval(cfg,theirs,null,P);
  const factors=[];
  const add=(label,pts,detail)=>factors.push({label,pts:Math.round(pts*10)/10,detail});
  if(T.aff!=null) add("Expérience des joueurs",(U.aff-T.aff)*14, `Vous ${Math.round(U.aff*100)} · eux ${Math.round(T.aff*100)} (sur 100 : vos games vs leur solo Q préparée)`);
  else add("Expérience des joueurs",0, "Pas de préparation adverse : facteur non comparé");
  add("Méta / force des picks",(U.meta-T.meta)*20, `Vous ${Math.round(U.meta*100)} · eux ${Math.round(T.meta*100)}`);
  add("Synergies",Math.max(-6,Math.min(6,(U.syn-T.syn)*0.6)), `Vous ${U.syn>0?"+":""}${Math.round(U.syn*10)/10} % · eux ${T.syn>0?"+":""}${Math.round(T.syn*10)/10} %`);
  const lanePts=A.lanes.reduce((s,l)=>s+(l.wr-50)*(l.role==="T"?0.9:0.6)*(l.est?0.4:1),0);
  add("Matchups de lane",Math.max(-8,Math.min(8,lanePts)), A.lanes.length?A.lanes.map(l=>`${l.role==="B"?"Botlane":ROLE_NAMES[l.role]} ${l.est?"≈":""}${l.wr} %`).join(" · "):"Pas de donnée de matchup sur ces lanes");
  add("Cohérence de compo",(T.tags.weak.length-U.tags.weak.length)*1.5+(U.tags.strong.length-T.tags.strong.length)*0.5, `${U.tags.weak.length} faiblesse(s) chez vous · ${T.tags.weak.length} chez eux`);
  const total=factors.reduce((s,f)=>s+f.pts,0);
  // Calibrage pro 2026 : l'écart prédit était trop large (40 % annoncé → 46 % réel) → resserré, borné 35–65 %
  const win=Math.round(Math.max(35,Math.min(65,50+0.6*total)));
  return {win, factors, us:U, them:T, lanes:A.lanes, plan:A.plan};
}

// Bans probables contre nous : ce que nos adversaires ont banni contre nous dans l'historique (même adversaire = poids double)
function bansAgainstUs(S,opp){ const cnt={}; let games=0;
  (S||[]).forEach(s=>{ const same=opp&&s.opponent&&String(s.opponent).toLowerCase()===String(opp).toLowerCase();
    (s.games||[]).forEach(g=>{ if(!(g.actions||[]).some(Boolean)) return; games++; (g.actions||[]).forEach((a,i)=>{ if(!a||!a.name||a.miss||STEPS[i][0]!=="ban"||STEPS[i][1]===g.side) return;
      const c=cnt[a.name]||(cnt[a.name]={name:a.name,n:0,same:0,p1:0}); c.n++; if(same) c.same++; if(i<6) c.p1++; }); }); });
  return {games,list:Object.values(cnt).map(c=>({...c,w:c.n+c.same})).sort((a,b)=>b.w-a.w||b.p1-a.p1)}; }

// ---- Analyse de la game (timeline exportée du client) : phases, lanes à 10/15 min, objectifs, lecture draft / gameplay ----
const _RK={}; try{ RIOT_KEYS_RAW.split("|").forEach(t=>{ const [k,n]=t.split(":"); _RK[k]=findChamp(n)||n; }); }catch(err){}
function gameAnalysis(cfg,s,gi,pp){
  const g=s.games[gi], st=g.stats, T=st&&st.tl; if(!T||!T.g||!T.p) return null;
  const side=g.side, roleOf={};
  (g.actions||[]).forEach((a,i)=>{ if(a&&a.name&&STEPS[i][0]==="pick") roleOf[(STEPS[i][1]===side?"u":"t")+a.name]=a.role; });
  const P=T.p.map(([sd,c],i)=>{ const n=_RK[String(c)]||String(c); return {i,sd,name:n,role:roleOf[(sd===0?"u":"t")+n]||null}; });
  const n=Math.max(...T.g.map(a=>a.length)), at=(arr,m)=>arr[Math.min(m,arr.length-1)]||0;
  const team=(sd,m,k)=>P.filter(p=>p.sd===sd).reduce((a,p)=>a+at(T[k][p.i],m),0);
  const gdc=[]; for(let m=0;m<n;m++) gdc.push(team(0,m,"g")-team(1,m,"g"));
  const min=n-1, GD=m=>m<=min?gdc[m]:null;
  const by=(sd,r)=>P.find(p=>p.sd===sd&&p.role===r);
  const lane=(rs,m,k)=>{ const u=rs.map(r=>by(0,r)), t=rs.map(r=>by(1,r)); if(u.some(x=>!x)||t.some(x=>!x)||m>min) return null; return u.reduce((a,p)=>a+at(T[k][p.i],m),0)-t.reduce((a,p)=>a+at(T[k][p.i],m),0); };
  const LR=[["T",["T"]],["J",["J"]],["M",["M"]],["A",["A"]],["S",["S"]],["B",["A","S"]]];
  const lanes=LR.map(([r,rs])=>{ const u=rs.map(x=>by(0,x)), t=rs.map(x=>by(1,x)); const xp=(rs.length===1&&u[0]&&t[0]&&T.x15)?(T.x15[u[0].i]-T.x15[t[0].i]):null;
    return {role:r,ours:u.map(x=>x&&x.name).join(" + "),theirs:t.map(x=>x&&x.name).join(" + "),gd10:lane(rs,10,"g"),gd15:lane(rs,15,"g"),cs15:lane(rs,15,"c"),xp15:min>=15?xp:null}; });
  const ev=(T.ev||[]).map(([t,ty,sd,x])=>({t,ty,sd,x}));
  const kills=ph=>[0,1].map(sd=>ev.filter(e=>e.ty==="K"&&e.sd===sd&&e.t>=ph[0]*60&&e.t<ph[1]*60).length);
  const phases=[["Early","0-15",0,15],["Mid","15-25",15,25],["Late","25+",25,999]].filter(p=>p[2]<min).map(([nm,lb,a,b])=>{ const e=Math.min(b,min); return {name:nm,label:lb,delta:gdc[e]-gdc[a],kills:kills([a,b]),obj:[0,1].map(sd=>ev.filter(x=>x.sd===sd&&"DHBVA".includes(x.ty)&&x.t>=a*60&&x.t<b*60).length)}; });
  const fb=ev.find(e=>e.ty==="K"), ft=ev.find(e=>e.ty==="T");
  const deaths15=P.filter(p=>p.sd===0).map(p=>({name:p.name,role:p.role,d:ev.filter(e=>e.ty==="K"&&e.sd===1&&e.x===p.i&&e.t<900).length})).filter(x=>x.d>=2);
  // lecture : plan de draft vs déroulé
  let f=null; try{ f=analyzeFinal(cfg,{side,actions:g.actions},pp||{players:[]},s.lineup||{}); }catch(err){}
  const notes=[], ue=f&&f.us&&f.us.prof?f.us.prof.p:null, te=f&&f.them&&f.them.prof?f.them.prof.p:null;
  const g15=GD(15), win=g.result==="W";
  if(ue&&te&&g15!=null){ const eu=ue.early-ue.scaling, et=te.early-te.scaling;
    if(eu>et+2) notes.push(g15>=1000?`Plan early respecté : notre compo plus forte tôt a pris ${Math.round(g15/100)/10}k d'avance à 15 min.`:`Plan early raté : notre compo devait prendre l'avantage tôt, mais ${g15>=0?"+":""}${Math.round(g15/100)/10}k à 15 min.`);
    else if(et>eu+2) notes.push(g15>=-1500?`Early tenu face à une compo plus forte tôt (${g15>=0?"+":""}${Math.round(g15/100)/10}k à 15 min) : le scaling devait jouer pour nous.`:`Early perdu nettement face à leur compo early (${Math.round(g15/100)/10}k à 15 min).`); }
  if(f&&f.lanes) f.lanes.forEach(l=>{ const L=lanes.find(x=>x.role===l.role); if(!L||L.gd15==null) return;
    if(l.wr>=52&&L.gd15<=-500) notes.push(`${l.role==="B"?"Botlane":ROLE_NAMES[l.role]} prévue gagnante (${l.wr} %) mais ${Math.round(L.gd15/100)/10}k à 15 min : exécution à revoir.`);
    if(l.wr<=48&&L.gd15<=-500) notes.push(`${l.role==="B"?"Botlane":ROLE_NAMES[l.role]} prévue perdante (${l.wr} %) et perdue (${Math.round(L.gd15/100)/10}k à 15 min) : la draft a pesé.`);
    if(l.wr<=48&&L.gd15>=500) notes.push(`${l.role==="B"?"Botlane":ROLE_NAMES[l.role]} prévue perdante (${l.wr} %) mais gagnée (+${Math.round(L.gd15/100)/10}k à 15 min).`); });
  const lead=Math.max(...gdc), deficit=Math.min(...gdc);
  if(!win&&lead>=2500) notes.push(`Avance de ${Math.round(lead/100)/10}k à ${gdc.indexOf(lead)} min non convertie.`);
  if(win&&deficit<=-2500) notes.push(`Retour après ${Math.round(-deficit/100)/10}k de retard (${gdc.indexOf(deficit)} min).`);
  deaths15.forEach(x=>notes.push(`${x.name} (${ROLE_NAMES[x.role]||"?"}) : ${x.d} morts avant 15 min.`));

  return {min,gdc,gd10:GD(10),gd15:g15,gd20:GD(20),gd25:GD(25),gdEnd:gdc[min],lanes,phases,fb:fb?{t:fb.t,sd:fb.sd}:null,ft:ft?{t:ft.t,sd:ft.sd,x:ft.x}:null,
    obj:ev.filter(e=>"DHBVA".includes(e.ty)).map(e=>({t:e.t,ty:e.ty,sd:e.sd,x:e.x})),notes,verdict,draftWin:f?f.win:null}; }

// ---- Revue de draft (après coup) : nos picks face aux conseils de l'outil, lanes prévues face à l'or réel ----
function draftReview(cfg,s,gi,pp){
  const g=s.games[gi], side=g.side, them=side==="B"?"R":"B", lineup=s.lineup||{};
  const locked=[]; s.games.slice(0,gi).forEach(x=>(x.actions||[]).forEach((a,i)=>{ if(a&&a.name&&STEPS[i][0]==="pick") locked.push(a.name); }));
  const ser={locked,games:s.games.slice(0,gi)}, idx={};
  (g.actions||[]).forEach((a,i)=>{ if(a&&a.name&&STEPS[i][0]==="pick") idx[a.name]=i; });
  const picks=[];
  (g.actions||[]).forEach((a,i)=>{ if(!a||!a.name||STEPS[i][0]!=="pick"||STEPS[i][1]!==side||!a.role) return;
    const d={side,actions:g.actions.map((x,j)=>j<i?x:null)}; let R; try{ R=recommendPicks(cfg,ser,d,lineup,40); }catch(err){ return; }
    const L=(R[a.role]&&R[a.role].list||[]).filter(x=>!x.offpool), k=L.findIndex(x=>x.name===a.name);
    let sc=k>=0?L[k].score:null; if(sc==null){ try{ const c=pickContext(d,lineup,ser); c.cfg=cfg; sc=scorePick(cfg,a.name,a.role,c).score; }catch(err){} }

  const ln=l=>{ const pr=l.wr>=52?"w":l.wr<=48?"l":"", ok=l.gd==null?"":(l.wr>=52&&l.gd>0)||(l.wr<=48&&l.gd<0)?"✓":(l.wr>=52&&l.gd<0)||(l.wr<=48&&l.gd>0)?"✗":"";

    <p class="muted">Conseils recalculés avec vos pools et tier lists actuels. L'or (à 15 min si la timeline est disponible, sinon en fin de game) n'est qu'un indice du résultat des lanes.</p></div>`; }

// ---------- Analyse de la game (timeline) ----------
function gdSvg(a){ const W=600,H=110,n=a.gdc.length, mx=Math.max(1500,...a.gdc.map(Math.abs)), x=m=>8+m*(W-16)/Math.max(1,n-1), y=v=>H/2-v*(H/2-10)/mx;
  const pts=a.gdc.map((v,m)=>`${x(m).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const band=(m0,m1,c)=>m0<n?`<rect x="${x(m0)}" y="0" width="${Math.max(0,x(Math.min(m1,n-1))-x(m0))}" height="${H}" fill="${c}"/>`:"";
  const IC={D:"🐉",H:"👁",B:"👑",V:"🪲",A:"☠"};
  const marks=a.obj.map(o=>`<text x="${x(o.t/60).toFixed(1)}" y="${o.sd===0?12:H-3}" font-size="10" text-anchor="middle">${IC[o.ty]||"•"}</text>`).join("");
  return `<svg class="gdsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${band(0,15,"rgba(255,255,255,.03)")}${band(25,999,"rgba(255,255,255,.03)")}
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#3a4352" stroke-dasharray="3 3"/>${[10,15,20,25,30,35].filter(m=>m<n).map(m=>`<text x="${x(m)}" y="${H/2+11}" font-size="9" fill="#6b7587" text-anchor="middle">${m}'</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="#4da3ff" stroke-width="2"/>${marks}</svg>`; }
function analysisHtml(s,gi){ let a; try{ a=gameAnalysis(cfg,s,gi,prepFor(s)); }catch(e){ return ""; } if(!a) return "";
  const k=v=>v==null?"–":Math.abs(v)<150?"≈ 0":(v>0?"+":"")+(v/1000).toFixed(1)+"k", c=v=>v==null?"":v>=150?"w":v<=-150?"l":"", n0=v=>v==null?"–":(v>0?"+":"")+v;
  const mm=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`, ON={D:"Drake",H:"Héraut",B:"Baron",V:"Larves",A:"Atakhan"};
  const lanes=a.lanes.filter(l=>l.role!=="A"&&l.role!=="S").concat(a.lanes.filter(l=>l.role==="A"||l.role==="S"));
  return `<div class="review gan"><h4>Analyse de la game</h4>
    ${a.verdict?`<p><b>${esc(a.verdict)}</b> <span class="muted">(draft estimée à ${a.draftWin} %)</span></p>`:""}
    <div class="gdh"><span>Écart d'or (nous − eux)</span><span class="muted">10' <b class="${c(a.gd10)}">${k(a.gd10)}</b> · 15' <b class="${c(a.gd15)}">${k(a.gd15)}</b> · 20' <b class="${c(a.gd20)}">${k(a.gd20)}</b> · fin <b class="${c(a.gdEnd)}">${k(a.gdEnd)}</b></span></div>
    ${gdSvg(a)}<p class="muted sm">Icônes en haut : objectifs pris par nous · en bas : par eux (🐉 drake, 🪲 larves, 👁 héraut, 👑 baron).</p>
    <table class="rvt"><tr><th>Phase</th><th>Or gagné</th><th>Kills</th><th>Objectifs</th></tr>${a.phases.map(p=>`<tr><td><b>${p.name}</b> <span class="muted">${p.label}'</span></td><td class="${c(p.delta)}">${k(p.delta)}</td><td>${p.kills[0]} – ${p.kills[1]}</td><td>${p.obj[0]} – ${p.obj[1]}</td></tr>`).join("")}</table>
    <table class="rvt"><tr><th>Lanes</th><th>Or 10'</th><th>Or 15'</th><th>CS 15'</th><th>XP 15'</th></tr>${lanes.map(l=>`<tr><td><b>${RVN(l.role)}</b> <span class="muted">${esc(l.ours)} vs ${esc(l.theirs)}</span></td><td class="${c(l.gd10)}">${k(l.gd10)}</td><td class="${c(l.gd15)}">${k(l.gd15)}</td><td class="${l.cs15>=8?"w":l.cs15<=-8?"l":""}">${n0(l.cs15)}</td><td class="${l.xp15>=300?"w":l.xp15<=-300?"l":""}">${n0(l.xp15)}</td></tr>`).join("")}</table>
    <p class="sm">${a.fb?`First blood : <b class="${a.fb.sd===0?"w":"l"}">${a.fb.sd===0?"nous":"eux"}</b> (${mm(a.fb.t)})`:""}${a.ft?` · Première tour : <b class="${a.ft.sd===0?"w":"l"}">${a.ft.sd===0?"nous":"eux"}</b> (${mm(a.ft.t)})`:""}</p>
    ${a.obj.length?`<div class="objl">${a.obj.reduce((L,o)=>{ const p=L[L.length-1]; if(p&&p.ty===o.ty&&p.sd===o.sd&&o.ty==="V"&&o.t-p.t<=120){ p.n=(p.n||1)+1; return L; } L.push({...o}); return L; },[]).map(o=>`<span class="${o.sd===0?"w":"l"}">${mm(o.t)} ${ON[o.ty]||o.ty}${o.n>1?" ×"+o.n:""}${o.ty==="D"&&o.x?" "+esc(o.x.toLowerCase()):""}</span>`).join("")}</div>`:""}
    ${a.notes.length?`<div class="rvnotes">${a.notes.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}
    <p class="muted sm">Lecture automatique à partir des chiffres : elle ne voit ni la communication ni les décisions, à confronter avec la VOD.</p></div>`; }
let _revCache=null;

  const pc=(a,b)=>b?Math.round(100*a/b)+" %":"–", wr=g=>g.n?`${g.w}/${g.n} (${pc(g.w,g.n)})`:"–";

      <div><b>Par série</b>${v.series.map(s=>`<span>${esc(s.date)} vs ${esc(s.opp||"?")} : ${s.w}/${s.n} · draft ${s.win} % · top 3 ${s.t3} %</span>`).join("")}</div>
    </div><p class="muted">Ouvre une game pour sa revue détaillée. Peu de games pour l'instant : à lire comme une tendance, pas comme une vérité.</p></section>`; }

const ourName=()=>prep.team||"BBJ", theirName=()=>(ui.histOpp!=null?ui.histOpp:prep.opponent)||"Adversaire";

function viewCenter(){
  const d=live.draft, i=targetIndex();
  const locked=live.series.locked.length?`<div class="locked"><span>Fearless</span>${live.series.locked.map(n=>`<span class="lk" title="${esc(n)}">${av(n,"sm")}</span>`).join("")}</div>`:"";
  if(i===-1) return locked+finalHtml(d,false);

  if(ours&&!editing) h+=`<div class="sugg">${t==="ban"?banBubbles():duoRow()+pickBubbles()}</div>`;
  return h+grid();

let lastRecs={};
function bubble(x,role,dim){
  const hk=x.name+"|"+(role||""); lastRecs[hk]=x; const sel=ui.pending&&ui.pending.name===x.name;

    ${av(x.name,"lg")}${x.rank?`<span class="sc rank${x.rank<=3?" hi":""}">${x.rank}</span>`:`<span class="sc ${x.score>=85?"hi":x.score>=72?"md":""}">${x.score}</span>`}${x.duo?'<span class="duom" title="Duo avéré avec un de vos picks">duo</span>':""}${x.offpool?'<span class="duom off" title="Hors de son pool, mais comble notre faiblesse">hors pool</span>':""}${x.ourFlex&&!x.duo&&!x.offpool&&teamPicksNames(live.draft,live.draft.side).length<3?`<span class="duom ofx" title="${esc("Flex chez nous : aussi joué "+x.ourFlex.map(r=>"en "+ROLE_NAMES[r]+" par "+((prep.lineup||{})[r]||ROLE_NAMES[r])).join(" et ")+". Pické tôt, il cache notre rôle.")}">flex</span>`:""}<span class="bn">${esc(x.name)}</span></button>`;
}
// Picks adverses au rôle incertain (flex) : alerte visible pendant nos picks ET nos bans
function flexBanner(){ const fxs=teamPicks(live.draft,live.draft.side==="B"?"R":"B").filter(p=>p.flex&&p.fx);
  return fxs.map(p=>`<div class="flexw"><b>⚠ ${esc(p.name)} : flex possible ${(p.fxr||[]).map(r=>ROLE_NAMES[r]).join(" / ")}</b><span>${esc(p.fx)}. Ne le counterpickez pas dans un rôle précis tant que son rôle n'est pas confirmé.</span></div>`).join(""); }
function pickBubbles(){
  const r=memo("picks",()=>recommendPicks(cfg,live.series,live.draft,prep.lineup,24)); lastRecs={};
  // Anneau vert : parmi les meilleurs de la ligne, ce pick punit la compo adverse (seulement les 3 premiers concernés, pour ne pas surcharger)
  Object.values(r).forEach(R=>R.list.filter(x=>x.exploit).slice(0,3).forEach(x=>{ if(x.score>=(R.list[0]?R.list[0].score:0)-12) x.ring="exploit"; }));
  // Picks 4-5 : bandeau + anneau bleu sur ce qui comble les faiblesses de notre compo (prioritaire sur le vert)
  const mine=teamPicksNames(live.draft,live.draft.side), gaps=mine.length>=3?familyGaps(mine).filter(g=>g!=="catch"):[];
  if(gaps.length) Object.values(r).forEach(R=>{ R.list.filter(x=>x.fill&&!x.offpool).slice(0,4).forEach(x=>x.ring="strat"); R.list.filter(x=>x.offpool).forEach(x=>x.ring="strat"); });
  const fxb=flexBanner();
  const banner=fxb+(gaps.length?`<div class="stratl deny"><i></i>Notre compo manque ${gaps.map(g=>g==="engage"?"d'engage":"de réception").join(" et ")} : les champions en bleu la combleraient (hors pool compris)</div>`:"");
  return banner+Object.keys(r).map(role=>`<div class="rrow"><div class="rl"><b>${ROLE_NAMES[role]}</b><span>${esc(prep.lineup[role])}</span></div>
    <div class="bubs fill">${r[role].list.map(x=>bubble(x,role,false)).join("")||'<span class="muted">Pool vide</span>'}</div></div>`).join("");
}
function duoRow(){
  const D=memo("duos",()=>recommendDuos(cfg,live.series,live.draft,prep.lineup,20)); if(!D.length) return "";
  return `<div class="rrow duo"><div class="rl"><b>Duos</b></div><div class="bubs fill duos">${D.map(x=>`<button class="duob${x.team?" team":""}" data-act="duo" data-a="${esc(x.a.name)}" data-ra="${x.roles[0]}" data-b="${esc(x.b.name)}" data-rb="${x.roles[1]}" title="${esc(x.a.name)} + ${esc(x.b.name)}${x.pro?` · ${x.pro.n} games ensemble en pro (${x.pro.wr} % de victoires)`:""}${x.team?" · déjà joués en équipe":""}${x.answer?" · répond à leurs picks":""}${x.edge&&x.edge.why.length?` · botlane estimée ${x.edge.v>0?"+":""}${x.edge.v} pts (${esc(x.edge.why.join(", "))})`:""}">
     ${av(x.a.name,"md")}${av(x.b.name,"md")}</button>`).join("")}</div></div>`;
}
function banBubbles(){
  const r=memo("bans",()=>recommendBans(cfg,live.series,live.draft,prep,prep.lineup,24)); lastRecs={};
  r.forEach((x,k)=>{ x.rank=k+1; lastRecs[x.name]=x; });
  const phase2=live.draft.actions.filter((a,i)=>a&&STEPS[i][0]==="pick").length>=6;
  // Bans 4-5 : la stratégie (les priver de ce qui manque / casser leur synergie) et un anneau bleu sur les bans qui la servent
  const strat=phase2?memo("bstrat",()=>banStrategy(cfg,live.series,live.draft,prep.lineup,prep)):null;
  if(strat) r.slice(0,6).forEach(x=>{ if(x.fam===strat.mode) x.ring="strat"; });
  // Bans 1-3 : rappel de nos 3 premiers bans de la game précédente (souvent les mêmes), à part des autres suggestions
  let prevRow=""; const G=live.series.games, ti=targetIndex();
  if(!phase2&&G.length&&ti>=0&&ti<6&&STEPS[ti][1]===live.draft.side){ const g=G[G.length-1], un=unavailable(live.series,live.draft);
    const pb=STEPS.map((s,k)=>({s,k})).filter(x=>x.k<6&&x.s[0]==="ban"&&x.s[1]===g.side).map(x=>g.actions[x.k]).filter(a=>a&&a.name&&!a.miss).map(a=>a.name);
    const items=pb.filter(n=>!un.has(n)).map(n=>{ const x=r.find(y=>y.name===n); return {...(x||{name:n,why:[]}),rank:x?x.rank:null,score:"–",ring:null,why:[`Banni par nous en game ${G.length}`,...((x&&x.why)||[])]}; });
    if(pb.length) prevRow=`<div class="rrow prevb"><div class="rl"><b>Game ${G.length}</b><span>nos bans 1-3</span></div><div class="bubs">${items.length?items.map(x=>bubble(x,null,false)).join(""):'<span class="muted">déjà bannis ou joués</span>'}</div></div>`; }
  return `${flexBanner()}${strat?`<div class="stratl ${strat.mode}"><i></i>${esc(strat.label)}</div>`:""}${prevRow}<div class="rrow"><div class="rl"><b>Bans</b><span>${phase2?"picks 4-5":(prep.players||[]).length?"préparation":"pro / méta"}</span></div>
    <div class="bubs fill">${r.map(x=>bubble(x,null,false)).join("")}</div></div>`;
}
function grid(){
  const un=unavailable(live.series,live.draft); const q=normName(ui.gridQ); const p=ui.pending;
  let list=CHAMP_NAMES.filter(n=>ui.gridRole==="all"||CHAMPS[n].roles.includes(ui.gridRole));
  // Notre tour de pick : étoile sur nos champions S à B (tier du joueur du rôle filtré, sinon meilleur tier parmi nos rôles encore libres)

  return `<div class="scmodal" data-act="tutoclose"><div class="scbox tutobox" data-act="none">
  <div class="row" style="justify-content:space-between"><h2>Bienvenue dans l'outil draft de BBJ</h2><button class="btn" data-act="tutoclose">✕</button></div>
  <h3>Installation (une fois)</h3><ol><li>Afficher la barre des favoris (Ctrl + Maj + B).</li><li>Onglet <b>Réglages</b> : glisser le bouton « Favori Drafter » dans la barre.</li><li>Autoriser les pop-ups pour drafter.lol.</li></ol>
  <p>Pendant la draft : dans la room Drafter, cliquer le favori. L'outil s'ouvre dans sa fenêtre et le badge <b>● BBJ synchro</b> apparaît. Les games suivantes suivent toutes seules ; recliquer seulement après un F5 sur Drafter.</p>
  <h3>Une draft</h3><ol><li><b>Côté</b> : détecté si une équipe s'appelle BBJ sur Drafter, sinon un clic Blue / Red.</li><li><b>Bans phase 1</b> : bans conseillés au centre ; nos premières cases montrent les meilleurs first picks (bleu) ou paires R1-R2 (rouge).</li><li><b>Picks</b> : par rôle libre, nos champions classés (détail au survol) ; étoile = nos tiers S/A/B. En face, leurs picks probables, <b>cercle rouge</b> = dangereux pour nous.</li><li><b>Bans phase 2</b> : contre notre compo ou ce qu'ils préparent.</li><li><b>Analyse finale</b>, puis <b>Partie suivante</b> (fearless appliqué) ou <b>Fin de série</b> (série et stats publiées pour l'équipe).</li></ol>
  <p>Drafter s'est trompé ? Cliquer la case, choisir le bon champion, Confirmer.</p>
  <h3>Le score d'un pick (sur 100)</h3><table>${R("Affinité 25","Notre tier list + nos games en équipe et en solo Q")}${R("Méta 25","60 % pro, 40 % solo Q Master+, buffs / nerfs du patch")}${R("Synergie 25","Avec nos champions déjà pris ; bonus si duo gagnant, malus s'il perd")}${R("Matchup ou blind 25","Laner adverse connu → counter à 100 % ; pas encore connu → blindabilité à 100 %. Top +35 %")}</table>
  <p>Jusqu'à 92 = normal ; 93-98 = gros counter + synergie + joueur en confiance ; 98-100 = en plus, casse la compo adverse.</p>
  <h3>Les onglets</h3><table>${R("Préparation","Adversaire et ses 5 pseudos : fiches et plan de bans")}${R("Pools","Ta tier list (S à D) : à tenir à jour, c'est la base des suggestions")}${R("Historique","Séries, résultats et stats des games")}${R("Réglages","Favori Drafter, poids du calcul")}</table>
  <p class="muted">Ce tuto se rouvre avec le bouton <b>Tuto</b> en haut.</p></div></div>`; }
function scoutModal(){
  const r=ui.scout; let P=[]; try{ P=prepPlayers(prep); }catch(e){} const p=P.find(x=>x.role===r); if(!p) return "";
  const un=unavailable(live.series,live.draft), I=ctrIndex(cfg), our=prep.lineup[r];
  const RK=rankPlayers(P), me=RK.find(x=>x.p===p), S=me.s;
  // Fiche vivante : on suit la draft. Notre pick à ce rôle déjà locké → c'est lui seul qu'on compare ; un champion indisponible (pick, ban, fearless) disparaît de la fiche
  const usSide=live.draft.side, myPick=live.draft.actions.find((a,k)=>a&&a.name&&STEPS[k][0]==="pick"&&STEPS[k][1]===usSide&&a.role===r&&!a.flex);
  const theirPick=live.draft.actions.find((a,k)=>a&&a.name&&STEPS[k][0]==="pick"&&STEPS[k][1]!==usSide&&a.role===r&&!a.flex);
  const ours=myPick?[myPick.name]:CHAMP_NAMES.filter(c=>{ const t=tierFor(cfg,our,r,c); if(!((t==="S"||t==="A")&&CHAMPS[c].roles.includes(r))) return false;
    if(un.has(c)) return false; const a=affinity(cfg,our,r,c); return a.games>=3||metaInfo(c,r).v>=0.75; }); // joué en scrim/compétition ou très méta, encore disponible
  const theirs=theirPick?[]:p.list.filter(x=>x.g>=5&&!un.has(x.c)).slice(0,12);
  const habits=myPick?vsAgainst(p,myPick.name).filter(x=>!un.has(x.c)&&x.g>=2).slice(0,6):[];
  const threats=[], answers=[];
  theirs.forEach(x=>ours.forEach(o=>{ const g=ctrGet(I,x.c,o,r); if(g&&g[2]>=51.5) threats.push({c:x.c,o,wr:g[2],g:x.g}); const h=ctrGet(I,o,x.c,r); if(h&&h[2]>=51.5) answers.push({c:o,vs:x.c,wr:h[2],g:x.g}); }));
  const rank=a=>a.sort((x,y)=>(y.wr-50)*Math.log(2+y.g)-(x.wr-50)*Math.log(2+x.g));
  const st=c=>un.has(c)?(live.series.locked.includes(c)?"fearless":"pris/banni"):"";
  const chip=(c,extra="")=>`<span class="scc ${st(c)?"off":""} ${st(c)==="fearless"?"fl":""}" title="${esc(c+(st(c)?" · "+st(c):""))}">${av(c,"md")}<b>${esc(c)}</b>${extra}</span>`;
  const duel=(o,t,wr,mine)=>mine
    ?`<div class="scduel mine"><span class="us">${av(o,"sm")} ${esc(o)}</span><i>contre</i><span class="${st(t)?"off":""}">${av(t,"sm")} ${esc(t)}</span><em title="Winrate de notre ${esc(o)}">${Math.round(wr*10)/10} %</em></div>`
    :`<div class="scduel"><span class="${st(t)?"off":""}">${av(t,"sm")} ${esc(t)}</span><i>contre</i><span class="us">${av(o,"sm")} ${esc(o)}</span><em title="Winrate de notre ${esc(o)}">${Math.round((100-wr)*10)/10} %</em></div>`;
  return `<div class="scmodal" data-act="scoutclose"><div class="scbox" data-act="none">
   <div class="schead"><span class="scno r${me.rank}" title="Place dans leur cinq (LP et pic, puis rendement, puis pool méta)">#${me.rank}</span>${roleIcon(r,26)}<div><b>${esc(p.name.split("#")[0])}</b><span class="muted"> · ${ROLE_NAMES[r]}</span></div><button class="btn sm" data-act="scoutclose">✕</button></div>
   <div class="scstats">${p.rank?`<span><em>Rang</em>${esc(p.rank)}</span>`:""}${p.peak?`<span><em>Pic</em>${esc(p.peak)}</span>`:""}${S.games?`<span><em>Games</em>${S.games}</span>`:""}${S.wr!=null?`<span><em>WR</em>${S.wr} %</span>`:""}</div>

   <h4>Profil</h4><ul>${p.note?`<li class="flx">${esc(p.note)}</li>`:""}${scoutProfile({...p,list:p.list.filter(x=>!un.has(x.c))},P.map(q=>({...q,list:q.list.filter(x=>!un.has(x.c))}))).map(l=>`<li>${esc(l)}</li>`).join("")}${(()=>{ if(!live.series.locked.length) return "";
      const top=p.list.slice(0,6), used=top.filter(x=>live.series.locked.includes(x.c)), left=top.filter(x=>!un.has(x.c)).slice(0,4);
      return `<li class="flx">Fearless : ${used.length?`déjà joués ${used.map(x=>x.c).join(", ")}`:"aucun de ses conforts joué"}${left.length?` · il lui reste ${left.map(x=>x.c).join(", ")}`:" · plus aucun confort disponible"}</li>`; })()}</ul>
   <h4>Champion pool</h4>
   ${theirPick?`<p class="flx">A pické <b>${esc(theirPick.name)}</b>.</p>`:""}<div class="scpool grid" style="--n:${(n=>n<=8?n:Math.ceil(n/2))(Math.min(15,p.list.filter(x=>!un.has(x.c)).length))}">${p.list.filter(x=>!un.has(x.c)).slice(0,15).map(x=>chip(x.c,`<em>${x.g} g${x.wr!=null?` · ${x.wr} %`:""}</em>`)).join("")}</div>
   ${myPick?`<h4>Ce qu'il joue d'habitude contre ${esc(myPick.name)} (solo Q)</h4>${habits.length?`<div class="scpool grid" style="--n:${habits.length}">${habits.map(x=>chip(x.c,`<em>${x.g} g · ${x.wr} %</em>`)).join("")}</div>`:`<p class="muted">Pas d'habitude repérée contre ${esc(myPick.name)}.</p>`}`:""}
   ${theirPick?"":`<h4>${myPick?`Ses champions qui contrent notre ${esc(myPick.name)}`:`Ses champions qui contrent nos meilleurs (${esc(our||"?")})`}</h4>`}
   ${theirPick?"":threats.length?`<div class="scduels">${rank(threats).slice(0,6).map(t=>duel(t.o,t.c,t.wr,false)).join("")}</div>`:`<p class="muted">Aucun counter net dans les données de matchups.</p>`}
   ${myPick||theirPick?"":`<h4>Nos réponses à ses champions</h4>
   ${answers.length?`<div class="scduels">${rank(answers).slice(0,6).map(t=>duel(t.c,t.vs,t.wr,true)).join("")}</div>`:`<p class="muted">Pas de réponse nette dans nos tiers S/A.</p>`}`}
  </div></div>`;
}

  <section class="card"><h3>Adversaire</h3>

    ${reqStatus()||prep.updatedAt?`<p class="muted">${reqStatus()}${prep.updatedAt?` Profils mis à jour le ${esc(prep.updatedAt)}.`:""}</p>`:""}</section>
  ${(()=>{ const B=bansAgainstUs(history.series,prep.opponent); if(!B.games||!B.list.length) return "";
    return `<section class="card"><h3>Bans probables contre nous</h3><p class="muted">Ce qu'on nous a banni sur ${B.games} games de l'historique (${esc(prep.opponent||"l'adversaire")} compte double). Utile pour préparer les plans B et s'entraîner à drafter avant le match.</p>
    <div class="chips">${B.list.slice(0,10).map(x=>`<span class="chip" title="${esc(`${x.name} : banni ${x.n} fois contre nous${x.same?`, dont ${x.same} par ${prep.opponent}`:""}`)}">${av(x.name,"sm")}<b>${x.n}×</b>${x.same?`<span class="muted">${esc(prep.opponent)} ${x.same}×</span>`:""}</span>`).join("")}</div></section>`; })()}
  <section class="card"><h3>Bans conseillés</h3>
    ${plan.length?`<div class="bplan">${plan.slice(0,7).map((x,k)=>`<div class="bpc"><span class="rk">${k+1}</span>${av(x.name,"lg")}<b>${esc(x.name)}</b><span class="muted">${esc(x.player.split("#")[0])} · ${ROLE_NAMES[x.role]}</span>
      <div class="btags">${x.tags.map(t=>`<span class="tag ${t==="Meilleur joueur"?"star":"ok"}" ${t==="Contrable par nous"&&x.counters.length?`title="${esc(x.counters.slice(0,3).map(o=>`${o.champ} (${o.player}, ${o.wr} %)`).join(", "))}"`:""}>${esc(t)}</span>`).join("")}</div>
      <ul class="bwhy">${x.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`).join("")}</div>`
      :`<div class="muted">Pas encore de profils adverses.</div>`}</section>
  ${P.length?`<section class="card"><h3>Profils adverses (solo Q)</h3>${P.map((p,k)=>`<div class="opp"><div class="row"><b>${esc(p.name)}</b><span class="muted">${esc(p.rank||"")}</span>${(()=>{const v=P.map(q=>rankValue(q.rank)); const me=v[k], o=v.filter((x,j)=>j!==k&&x!=null); const g=me!=null&&o.length?me-o.reduce((a,b)=>a+b,0)/o.length:0; return g>=400?`<span class="tag star">Meilleur joueur (+${Math.round(g)} LP)</span>`:"";})()}
      <select data-act="prole" data-k="${k}">${ROLES.map(r=>`<option value="${r}" ${p.role===r?"selected":""}>${ROLE_NAMES[r]}</option>`).join("")}</select></div>

// Lien multi-op.gg -> Riot IDs (le rôle de chaque adversaire est déduit de ses champions)
function idsFromLink(url){
  try{ const u=new URL(url.trim()); const q=u.searchParams.get("summoners")||u.searchParams.get("summonerName")||"";
    return q.split(",").map(x=>x.trim()).filter(Boolean).map(x=>x.includes("#")?x:x.replace(/-([^-]+)$/,"#$1")).slice(0,5); }catch(e){ return []; }
}
function nextRun(){ const n=new Date(), h=n.getHours()+n.getMinutes()/60; return h<17.78?"aujourd'hui vers 17 h 47":"demain vers 17 h 47"; }
function multiLink(){ const ids=(prep.ids||[]).filter(x=>x&&x.includes("#")); return ids.length?"https://op.gg/fr/lol/multisearch/euw?summoners="+encodeURIComponent(ids.join(",")):""; }
function reqStatus(){ const q=prep.request; if(!q) return "";
  return q.status==="done"?"Analyse terminée.":q.status==="error"?"L'analyse a échoué : "+esc(q.note||"")+".":`Analyse demandée le ${esc(q.at)} : elle sera faite automatiquement ${nextRun()}. Si c'est urgent, envoie le lien à Claude dans la conversation.`; }
function dupWarn(){ const v=ROLES.map(r=>prep.lineup[r]); const d=v.filter((p,k)=>v.indexOf(p)!==k); return d.length?`<div class="warn">⚠ ${esc(d.join(", "))} est placé sur deux rôles.</div>`:""; }

// ---------- Pools ----------
// Mini fiche d'un champion : uniquement nos parties en scrim/compétition (Parthenon)
function champSheet(pid,role,c){
  const T=teamStats(history), R=(T[pid]||{}), x=(R[role]||{})[c], other=Object.keys(R).filter(r=>r!==role&&R[r][c]);
  let h=`<div class="sheet">${av(c,"lg")}<div><b>${esc(c)}</b><div class="muted">${esc(pid)} · ${ROLE_NAMES[role]} · scrims et compétition</div>`;
  if(!x) return h+`<div class="muted">Aucune partie en scrim ou compétition sur ce champion.</div></div></div>`;
  const [g,w,K,D,A,sh,gd,gn]=x, f=v=>Math.round(v/g*10)/10, k=f(K), dd=f(D), a=f(A), kda=D?((K+A)/D).toFixed(1):"∞", wr=Math.round(100*w/g), pf=champPerf(T,pid,role,c), sp=Math.round(100*sh/g), gm=gn?Math.round(gd/gn):null;
  const col=v=>v>=65?"good":v>=45?"mid":"bad";
  h+=`<div class="sst"><span><em>Games</em><b>${g}</b> <i>${w}V-${g-w}D</i></span><span><em>Winrate</em><b class="${col(wr)}">${wr} %</b></span>
   <span><em>KDA</em><b>${kda}</b> <i>${k}/${dd}/${a}</i></span><span><em>Dégâts</em><b>${sp} %</b> <i>de l'équipe</i></span>
   <span><em>Or à 15 min</em>${gm==null?"<b>—</b>":`<b class="${gm>=0?"good":"bad"}">${gm>=0?"+":""}${gm}</b>`}</span><span><em>Performance</em><b class="${col(pf)}" title="50 = son niveau habituel à ce rôle">${pf}/100</b></span></div>`;
  if(g<4) h+=`<div class="muted">Peu de games : note ramenée vers 50.</div>`;
  if(other.length) h+=`<div class="muted">Aussi joué en ${other.map(r=>ROLE_NAMES[r]+` (${R[r][c][0]} g.)`).join(", ")}.</div>`;
  return h+`</div></div>`;
}
function viewPools(){
  const p=PLAYERS.find(x=>x.id===ui.poolPlayer)||PLAYERS[0], role=p.main;
  const names=poolOf(cfg,p.id,role); const rows={S:[],A:[],B:[],C:[],D:[],"?":[]};
  names.forEach(c=>{ const t=(cfg.tiers[p.id]||{})[c]; rows[t||"?"].push({c,a:affinity(cfg,p.id,role,c)}); });
  for(const k in rows) rows[k].sort((x,y)=>y.a.v-x.a.v);
  const TS=teamStats(history), mine=(TS[p.id]||{})[role]||{};
  const cell=x=>{ const t=mine[x.c], sq=(OUR_SQ[p.id]||{})[x.c];
    return `<button class="pc" data-act="tierpop" data-c="${esc(x.c)}">${av(x.c,"lg")}<span class="pn">${esc(x.c)}</span>
     <span class="pm2"><span class="tm${t?"":" none"}" title="Scrims + compétition"><b>${t?t[0]:0}</b><em>équipe</em></span><span class="sq" title="Solo Q (op.gg)"><b>${sq?sq.g:0}</b><em>SQ</em></span></span></button>`; };
  return `<nav class="ptabs">${PLAYERS.map(x=>`<button data-act="pplayer" data-p="${esc(x.id)}" class="${x.id===p.id?"on":""}">${esc(x.id)}<em>${ROLE_NAMES[x.main]}</em></button>`).join("")}</nav>
  <section class="card">
   ${["S","A","B","C","D","?"].map(t=>rows[t].length||t!=="?"?`<div class="trow"><div class="tl t${t==="?"?"Q":t}">${t==="?"?"Hors tier":t}</div><div class="tcs">${rows[t].map(cell).join("")||'<span class="muted">—</span>'}</div></div>`:"").join("")}
   ${ui.tierPop?`<div class="pop">${champSheet(p.id,role,ui.tierPop)}<div class="poprow"><span class="muted">Tier :</span>${["S","A","B","C","D"].map(t=>`<button data-act="settier" data-t="${t}" class="${(cfg.tiers[p.id]||{})[ui.tierPop]===t?"on":""}">${t}</button>`).join("")}<button data-act="settier" data-t="-">Retirer</button><button data-act="settier" data-t="x">×</button></div></div>`:""}
   <div class="row"><input list="champs" id="addpool" placeholder="Ajouter un champion au pool de ${esc(p.id)}…"><button class="btn" data-act="addpool">Ajouter</button></div></section>`;
}

function viewSettings(){
  const W=cfg.weights; for(const k of Object.keys(W)) if(!(k in {affinite:1,force:1,synergie:1,matchup:1})) delete W[k]; const lab={affinite:"Affinité : games en scrim/compétition + solo Q",force:"Méta : games pro récentes + solo Q du patch",synergie:"Synergie avec vos picks + cohérence de la compo (comble-t-il une faiblesse ?)",matchup:"Matchup contre leurs picks (ou capacité à être blind pick) ; compte 35 % de plus en top"};
  return `<section class="card"><h3>Poids du score sur 100</h3>${Object.keys(W).map(k=>`<label class="sl">${lab[k]} <b>${W[k]}</b><input type="range" min="0" max="50" value="${W[k]}" data-act="w" data-k="${k}"></label>`).join("")}

   <section class="card"><h3>Ordre des rôles en draft</h3><p class="muted">Du rôle pické le plus tôt au plus tard. Il ordonne les lignes de suggestions et pénalise, en début de draft seulement, un rôle pické trop tôt (critère Timing). Le support remonte dès que l'ADC est pris.</p>
   <div class="row">${roleOrderOf(cfg).map((r,k)=>`<span class="tag">${k+1}. ${ROLE_NAMES[r]}${k?` <button class="btn sm" data-act="rup" data-r="${r}" title="Monter">↑</button>`:""}</span>`).join("")}</div></section>
   <section class="card"><h3>Sources</h3><p class="muted">Méta : OP.GG Maître+ et Émeraude+ patch 26.23 (relevé du 27/11), combinée à 35 % avec le pro (65 %), lui-même corrigé par l'évolution réelle du winrate solo Q (LoLalytics Maître+) entre le patch des Worlds (26.20) et le 26.23, ajustée avec le patch ${PATCH_NEXT.v} (▲ ${esc(PATCH_NEXT.buff.split(",").join(", "))} ▼ ${esc(PATCH_NEXT.nerf.split(",").join(", "))}). Pro : gol.gg (ordre de pick, position de pick). Duos pro : 12 746 games pro 2025-2026, récentes pondérées plus fort, reworks exclus. Matchups : lolalytics Maître+ 26.22, complétés par lolstats.gg. Synergies : lolstats.gg (botlane), metabot.gg (autres rôles). Nos games : Parthénon (72 scrims jusqu'au 17/11) puis les séries exportées avec « Fin de série ». Solo Q : op.gg, tous les comptes de chaque joueur.</p></section>
   ${synEditor()}${ctrEditor()}${bookmarkCard()}
   <section class="card"><button class="btn" data-act="reset">Réinitialiser les réglages</button></section>`;

function synEditor(){
  const q=ui.synQ, n=findChamp(q);
  const list=synPairs(cfg).filter(x=>!q||(n&&(x[0]===n||x[2]===n))).sort((a,b)=>b[4]-a[4]);
  const rl=r=>r?` <span class="muted">${ROLE_NAMES[r]}</span>`:"";
  return `<details class="card" ${q?"open":""}><summary><h3>Synergies <span class="muted">(${synPairs(cfg).length})</span></h3></summary>
   <div class="row"><input list="champs" data-act="synq" value="${esc(q)}" placeholder="Filtrer par champion…"></div>
   <p class="muted">Écart de winrate du duo par rapport à ce qu'on attendrait des deux champions seuls. Support-ADC, support-jungle, jungle-mid et jungle-top : metabot.gg Émeraude+ 26.22 ; botlane aussi lolstats.gg Maître+.</p>

function flash(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(flash.t); flash.t=setTimeout(()=>t.classList.remove("on"),2200); }
// Pick adverse : quel joueur de leur cinq le joue ? Plusieurs rôles possibles (ou rôle inhabituel) => « Flex ? »
// Pick adverse : rôle le plus probable du champion, départagé par le joueur adverse qui le joue le plus à son rôle
// Rôle d'un pick adverse : rôles du champion + joueurs adverses qui l'ont dans leur pool (même hors de son rôle habituel, ex. Viktor ADC).
// Si au moins deux joueurs le jouent vraiment, c'est un flex possible : rôle incertain tant que Drafter ne l'a pas confirmé.
function enemyRole(c,taken,full){ const C=CHAMPS[c]; if(!C) return null; let P=[]; try{ P=prepPlayers(prep); }catch(e){}
  const prior=[1,0.55,0.3,0.2], cand={};
  C.roles.forEach((r,i)=>{ if(!taken.includes(r)) cand[r]={r,s:(prior[i]||0.15),g:0}; });
  P.forEach(p=>{ if(!p.role||taken.includes(p.role)) return; const x=(p.all||p.list||[]).find(y=>y.c===c); if(!x||!x.g) return;
    const k=cand[p.role]||(cand[p.role]={r:p.role,s:0,g:0}); k.g=x.g; k.pl=String(p.name||"").split("#")[0];
    k.s=(C.roles.includes(p.role)?0.3:0)+Math.min(1,x.g/50); });
  const L=Object.values(cand).sort((a,b)=>b.s-a.s), best=L[0]; if(!best) return null;
  const pl=L.filter(k=>k.g>=10); let fx=null;
  if(pl.length>=2&&pl[1].g>=0.5*pl[0].g) fx={roles:pl.map(k=>k.r), txt:pl.map(k=>`${k.pl} (${ROLE_NAMES[k.r]}, ${k.g} games)`).join(" ou ")};
  return full?{r:best.r,fx}:best.r; }
function addChamp(name,role){
  const i=targetIndex(); if(i<0) return false; const n=findChamp(name); if(!n){ flash("Champion inconnu"); return false; }
  const old=live.draft.actions[i];
  const un=unavailable(live.series,live.draft); if(un.has(n)&&!(old&&old.name===n)){ flash(n+" n'est plus disponible"); return false; }
  const [t,s]=STEPS[i]; const a={name:n};
  if(t==="pick"){ const taken=teamPicks(live.draft,s).filter(p=>!p.flex&&p!==old).map(p=>p.role);
    a.role=role||(old&&old.role&&CHAMPS[n].roles.includes(old.role)?old.role:null)||CHAMPS[n].roles.find(r=>!taken.includes(r))||CHAMPS[n].roles[0]; a.flex=old?!!old.flex:false;
    if(s!==live.draft.side&&!role&&!old){ const r=enemyRole(n,teamPicks(live.draft,s).filter(p=>!p.flex).map(p=>p.role),true); if(r){ a.role=r.r; if(r.fx){ a.flex=true; a.fx=r.fx.txt; a.fxr=r.fx.roles; } } } }
  live.draft.actions[i]=a; if(ui.edit!=null||(old&&old.miss)){ (live.draft.manual=live.draft.manual||{})[i]=a; } ui.hover=null; ui.pending=null; ui.edit=null; ui.gridQ=""; persist("live"); render(); return true;
}
function parseManual(txt){
  return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const k=l.indexOf(":"); const name=k>0?l.slice(0,k).trim():""; const rest=k>0?l.slice(k+1):l;
    const champs=rest.split(",").map(s=>s.trim()).filter(Boolean).map(s=>{ const m=s.match(/^(.+?)\s+(\d+)(?:\s+(\d+(?:[.,]\d+)?))?\s*%?$/); const c=findChamp(m?m[1]:s); return c?[c,m?+m[2]:0,m&&m[3]?parseFloat(m[3].replace(",",".")):null]:null; }).filter(Boolean);
    return {name, champs}; }).filter(p=>p.champs.length);
}

function adoptSnapHistory(){ if(!_snapArt||!_snapArt.history||sync.histAt==null||_snapArt.at<=sync.histAt) return false;

async function initSnapshot(){

  try{ const r=await fetch("team.json",{cache:"no-store"}); if(!r.ok) return; const s=await r.json(); if(!s||!s.at) return;
    let seen=0; try{ seen=+localStorage.getItem(LS+"-snap")||0; }catch(e){}
    // Profils adverses perdus en local (série remise à zéro, nouveau navigateur…) : on recharge la préparation publiée, sans toucher au reste
    if(s.at<=seen){ if(!(prep.players||[]).length&&s.prep&&(s.prep.players||[]).length){ prep=Object.assign({opponent:"",link:"",players:[],lineup:{...DEF_LINEUP}},prep,{opponent:s.prep.opponent||prep.opponent,link:s.prep.link||"",ids:s.prep.ids||[],players:s.prep.players,updatedAt:s.prep.updatedAt||""}); fixNames(); saveLocal(); render(); flash("Profils adverses rechargés"); } return; }
    if(s.config) cfg=migrate(Object.assign(defaultConfig(),s.config)); if(s.prep) prep=Object.assign({opponent:"",link:"",players:[],lineup:{...DEF_LINEUP}},s.prep); if(s.history) history=Object.assign({series:[]},s.history); fixNames();
    try{ localStorage.setItem(LS+"-snap",String(s.at)); }catch(e){}

  }catch(e){}
}

const bbjBC=("BroadcastChannel" in window)?new BroadcastChannel("bbj-outil"):null;

  if(m&&m.type==="bbj-active"&&m.id!==WIN_ID&&drafterLast){ const mine=live.drafterGame||0; if(m.game>mine||(m.game===mine&&m.start>WIN_START)) yieldWindow(); } };
function importFromHash(){ const m=location.hash.match(/^#import=([\w-]+)/); if(!m) return;
  window.history.replaceState(null,"",location.pathname+location.search);
  let data; try{ const b=m[1].replace(/-/g,"+").replace(/_/g,"/"), bin=atob(b+"===".slice((b.length+3)%4)); data=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))); }catch(e){ flash("Import illisible"); return; }
  const G=(data.games||[]).slice().sort((a,b)=>a.at-b.at); if(!G.length) return;
  const S=history.series||[]; let s=S.find(x=>x.pendingExport)||S.find(x=>x.games.length===G.length&&!x.games.some(g=>g.stats))||S[0]; if(!s) return;
  const games=s.games, off=Math.max(0,G.length-games.length), list=G.slice(off);
  games.forEach((g,i)=>{ const x=list[i]; if(!x) return; g.stats={gameId:x.gameId,min:x.min,us:x.us,them:x.them,objUs:x.objUs,objThem:x.objThem}; if(!g.result&&x.win!=null) g.result=x.win?"W":"L"; });
  delete s.pendingExport; persist("history"); saveNow(); if(bbjBC) bbjBC.postMessage("reload");
  ui.tab="hist"; flash(`Stats de ${Math.min(list.length,games.length)} games ajoutées à la série vs ${s.opponent}`); render(); }
loadLocal(); ui.tuto=false; render(); initDb(); initSnapshot(); setTimeout(importFromHash,300); setTimeout(rvWarm,2500);
